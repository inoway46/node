name: SEA GNU ld relink verification

on:
  push:
    branches: [sea-arm64-page-size-repro]
    paths:
      - .github/workflows/sea-node-relink.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.repository == 'inoway46/node'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      products_ready: ${{ steps.products.outcome == 'success' }}
    env:
      CC: clang-19
      CXX: clang++-19
      CFLAGS: -fno-pie
      CXXFLAGS: -fno-pie
      LDFLAGS: -fuse-ld=bfd -no-pie -Wl,-z,max-page-size=65536,-z,common-page-size=65536
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: b723a5709396f8862aed2d599ca5182052852451
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 binutils ninja-build zstd
          df -h .
      - name: Download saved build tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sea-node-build-tree
          run-id: 40908890866
          github-token: ${{ github.token }}
          path: restore
      - name: Restore and verify source provenance
        run: |
          set -euxo pipefail
          (cd restore && sha256sum --check node-build-tree.tar.zst.sha256)
          tar --zstd -xf restore/node-build-tree.tar.zst
          test "$(cat build-evidence/source-sha.txt)" = "$(git rev-parse HEAD)"
          (cd . && sha256sum --check build-evidence/node-sha256.txt)
          mv build-evidence source-build-evidence
      - name: Prove the regression test fails on official v26.13.0
        run: |
          set -euxo pipefail
          mkdir downloads payload build-evidence
          (
            cd downloads
            archive=node-v26.13.0-linux-arm64.tar.xz
            curl --fail --location --retry 3 -O "https://nodejs.org/dist/v26.13.0/$archive"
            curl --fail --location --retry 3 -O https://nodejs.org/dist/v26.13.0/SHASUMS256.txt
            grep "  $archive\$" SHASUMS256.txt > ../build-evidence/SHA256SUM
            sha256sum --check ../build-evidence/SHA256SUM
            tar -xJf "$archive" --strip-components=1 node-v26.13.0-linux-arm64/bin/node
            printf '%s\n' 'console.log("hello from sea", process.version);' > main.js
            printf '%s\n' '{"main":"main.js","output":"../payload/official","disableExperimentalSEAWarning":true}' > sea.json
            bin/node --build-sea sea.json
          )
          set +e
          downloads/bin/node test/sea/test-build-sea-elf-page-alignment.js > build-evidence/test-before.txt 2>&1
          result=$?
          set -e
          cat build-evidence/test-before.txt
          test "$result" = 1
          grep -F 'SEA must preserve the input ELF' build-evidence/test-before.txt
      - name: Relink existing objects with GNU ld
        id: relink
        run: |
          set -euxo pipefail
          git rev-parse HEAD > build-evidence/source-sha.txt
          printf '%s\n' 40908890866 > build-evidence/source-run-id.txt
          cp source-build-evidence/bss-layout.json build-evidence/bss-layout-before.json
          cp source-build-evidence/readelf-l.txt build-evidence/readelf-before.txt
          python3 - <<'LINK' 2>&1 | tee build-evidence/relink.txt
          import shlex
          import subprocess
          from pathlib import Path
          command = Path('source-build-evidence/build-commands.txt').read_text().splitlines()[-1]
          args = shlex.split(command)
          assert args[0] == 'clang++-19'
          assert args.count('-fuse-ld=lld') == 1
          assert args[args.index('-o') + 1] == 'node'
          Path('build-evidence/link-command-before.txt').write_text(command + '\n')
          args[args.index('-fuse-ld=lld')] = '-fuse-ld=bfd'
          Path('build-evidence/link-command-after.txt').write_text(shlex.join(args) + '\n')
          subprocess.run(args, cwd='out/Release', check=True)
          LINK
          out/Release/node --version | tee build-evidence/node-version.txt
          readelf -hW out/Release/node | tee build-evidence/node-header.txt
          grep -E 'Type: +EXEC' build-evidence/node-header.txt
          cp config.gypi build-evidence/
      - name: Capture ELF layout and build environment before tests
        run: |
          set -euxo pipefail
          for kind in h l S d n; do
            readelf -"$kind"W out/Release/node > "build-evidence/readelf-$kind.txt"
          done
          sha256sum out/Release/node > build-evidence/node-sha256.txt
          ninja -C out/Release -t query node > build-evidence/node-build-inputs.txt
          {
            uname -a
            getconf PAGESIZE
            clang-19 --version
            linker_path=$(clang-19 -print-prog-name=ld.bfd)
            echo "$linker_path"
            "$linker_path" --version
            ninja --version
            python3 --version
            dpkg-query -W clang-19 binutils libc6 libc6-dev libstdc++6 ninja-build
            du -sh out
            df -h .
          } > build-evidence/build-environment.txt
          python3 - <<'ELF' | tee build-evidence/bss-layout.json
          import json
          import struct
          from pathlib import Path
          data = Path('out/Release/node').read_bytes()
          assert data[:6] == b'\x7fELF\x02\x01'
          phoff = struct.unpack_from('<Q', data, 32)[0]
          phsize, count = struct.unpack_from('<HH', data, 54)
          loads = []
          for i in range(count):
              kind, flags, offset, va, pa, filesz, memsz, align = struct.unpack_from('<IIQQQQQQ', data, phoff + i * phsize)
              if kind == 1:
                  loads.append(dict(index=i, flags=flags, offset=hex(offset),
                                    vaddr=hex(va), filesz=hex(filesz), memsz=hex(memsz),
                                    alignment=hex(align), bss_like=filesz < memsz))
          bss_count = sum(segment['bss_like'] for segment in loads)
          print(json.dumps(dict(load_segments=loads, bss_like_count=bss_count,
                                lief_bss_end_requires_exactly_one=bss_count == 1), indent=2))
          ELF
      - name: Package executable before tests
        run: |
          tar -cf node-binary.tar out/Release/node build-evidence
          sha256sum node-binary.tar > node-binary.tar.sha256
      - name: Save executable and diagnostics before tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sea-node-binary
          path: |
            node-binary.tar
            node-binary.tar.sha256
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
      - name: Check that the relinked ELF meets the BSS_END precondition
        run: |
          python3 - <<'ELF'
          import json
          from pathlib import Path
          before = json.loads(Path('build-evidence/bss-layout-before.json').read_text())
          after = json.loads(Path('build-evidence/bss-layout.json').read_text())
          assert before['bss_like_count'] == 2
          assert after['bss_like_count'] == 1
          ELF
      - name: Run new regression test
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          out/Release/node test/sea/test-build-sea-elf-page-alignment.js 2>&1 | tee build-evidence/test-after.txt
      - name: Run SEA suite
        id: suite
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/test.py -p tap -j2 sea 2>&1 | tee build-evidence/sea-suite.txt
      - name: Generate integrated SEA and inspect its layout
        run: |
          set -euxo pipefail
          cp out/Release/node payload/node
          (
            cd downloads
            ../out/Release/node --build-sea sea.json
            mv ../payload/official ../payload/integrated
            bin/node --build-sea sea.json
          )
          payload/integrated | tee build-evidence/host-integrated.txt
          grep -Fx "hello from sea $(out/Release/node --version)" build-evidence/host-integrated.txt
          readelf -lW payload/integrated > build-evidence/integrated-segments.txt
          python3 - <<'ELF' | tee build-evidence/elf-checks.txt
          import struct
          from pathlib import Path
          for variant in ('node', 'integrated'):
              data = Path('payload', variant).read_bytes()
              assert data[:6] == b'\x7fELF\x02\x01'
              phoff = struct.unpack_from('<Q', data, 32)[0]
              phsize, count = struct.unpack_from('<HH', data, 54)
              loads = []
              for i in range(count):
                  t, flags, offset, va, pa, filesz, memsz, align = struct.unpack_from('<IIQQQQQQ', data, phoff + i * phsize)
                  if t == 1 and memsz:
                      assert align >= 65536
                      loads.append((offset, va, memsz))
              assert loads
              for page in (4096, 16384, 65536):
                  spans = []
                  for offset, va, size in loads:
                      assert offset % page == va % page
                      spans.append((va // page, (va + size - 1) // page))
                  spans.sort()
                  assert all(b[0] > a[1] for a, b in zip(spans, spans[1:]))
                  print(variant, page, 'PASS')
          ELF
          sha256sum payload/* > build-evidence/output-checksums.txt
          git diff --exit-code
          tar -cf products.tar payload build-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        id: products
        with:
          name: sea-node-products
          path: products.tar
          compression-level: 1
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sea-node-build-evidence
          path: build-evidence/
      - name: Report test failures
        if: always()
        env:
          REGRESSION_RESULT: ${{ steps.regression.outcome }}
          SUITE_RESULT: ${{ steps.suite.outcome }}
        run: |
          test "$REGRESSION_RESULT" = success
          test "$SUITE_RESULT" = success

  verify:
    needs: build
    if: ${{ always() && github.repository == 'inoway46/node' && needs.build.outputs.products_ready == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: 16384
            image: debian:trixie
            package: linux-image-arm64-16k
          - page: 65536
            image: ubuntu:24.04
            package: linux-image-generic-64k
    env:
      EXPECTED_PAGE: ${{ matrix.page }}
      KERNEL_IMAGE: ${{ matrix.image }}
      KERNEL_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Install emulator and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm busybox-static cpio binutils strace
          mkdir -p evidence payload/bin payload/proc payload/sys payload/dev payload/tmp
          uname -a | tee evidence/host.txt
          getconf PAGESIZE | tee -a evidence/host.txt
          test "$(getconf PAGESIZE)" = 4096
          qemu-system-aarch64 --version | tee -a evidence/host.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sea-node-products
      - name: Unpack identical inputs and injected executables
        run: |
          tar -xf products.tar
          cp build-evidence/* evidence/

      - name: Obtain distribution kernel
        run: |
          set -euxo pipefail
          docker pull "$KERNEL_IMAGE"
          docker image inspect "$KERNEL_IMAGE" > evidence/container-image.json
          docker run --name kernel-source -e DEBIAN_FRONTEND=noninteractive "$KERNEL_IMAGE" \
            sh -euxc 'apt-get update; apt-get install -y --no-install-recommends "$1"; dpkg-query -W' sh "$KERNEL_PACKAGE" \
            2>&1 | tee evidence/kernel-packages.txt
          mkdir kernel
          docker cp kernel-source:/boot/. kernel/
          kernel_path=$(find kernel -maxdepth 1 -name 'vmlinuz-*' | head -n 1)
          test -n "$kernel_path"
          cp "$kernel_path" vmlinuz
          cp kernel/config-* evidence/
          sha256sum vmlinuz | tee evidence/kernel-checksum.txt
          if [ "$EXPECTED_PAGE" = 16384 ]; then
            grep -H '^CONFIG_ARM64_16K_PAGES=y' evidence/config-*
          else
            grep -H '^CONFIG_ARM64_64K_PAGES=y' evidence/config-*
          fi

      - name: Assemble minimal guest initramfs
        run: |
          set -euxo pipefail
          cp /bin/busybox payload/bin/busybox
          for applet in sh mount uname cat poweroff sync timeout dmesg tail grep; do
            ln -s busybox "payload/bin/$applet"
          done
          cp /usr/bin/getconf /usr/bin/strace payload/bin/
          for executable in payload/node /usr/bin/getconf /usr/bin/strace; do
            ldd "$executable" | tee -a evidence/shared-libraries.txt
            while read -r library; do
              cp --parents -L "$library" payload/
            done < <(ldd "$executable" | awk '/=> \// {print $3} /^[[:space:]]*\// {print $1}')
          done
          printf '%s\n' "$EXPECTED_PAGE" > payload/expected-page
          cat > payload/init <<'GUEST'
          #!/bin/sh
          export PATH=/bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          ulimit -c 0
          echo SEA_GUEST_BEGIN
          uname -a
          page=$(getconf PAGESIZE)
          expected=$(cat /expected-page)
          echo "PAGE_SIZE=$page EXPECTED=$expected"
          ok=1
          [ "$page" = "$expected" ] || ok=0
          timeout 60 /node --version > /tmp/node.txt 2>&1
          stock_rc=$?
          cat /tmp/node.txt
          [ "$stock_rc" = 0 ] || ok=0
          main_version=$(cat /tmp/node.txt)
          for variant in official integrated; do
            timeout 60 "/$variant" > /tmp/sea.txt 2>&1
            sea_rc=$?
            cat /tmp/sea.txt
            version=$main_version
            [ "$variant" != official ] || version=v26.13.0
            echo "RESULT version=$version variant=$variant page=$page stock_exit=$stock_rc sea_exit=$sea_rc"
            if [ "$variant" = integrated ]; then
              [ "$sea_rc" = 0 ] && grep -Fxq "hello from sea $main_version" /tmp/sea.txt || ok=0
            else
              [ "$sea_rc" = 139 ] || ok=0
              timeout 60 strace -f -e trace=execve "/$variant" 2>&1
            fi
          done
          dmesg | tail -n 30
          if [ "$ok" = 1 ]; then
            echo SEA_NODE_PASS
          else
            echo SEA_NODE_FAIL
          fi
          sync
          poweroff -f
          GUEST
          chmod +x payload/init
          (cd payload && find . -print0 | cpio --null -o --format=newc --owner=0:0 | gzip -1) > initramfs.cpio.gz

      - name: Boot real large-page kernel and assert before/after behavior
        run: |
          set -o pipefail
          timeout 600 qemu-system-aarch64 \
            -machine virt -cpu max -accel tcg -smp 2 -m 4096 \
            -nographic -no-reboot -nic none \
            -kernel vmlinuz -initrd initramfs.cpio.gz \
            -append 'console=ttyAMA0 rdinit=/init panic=-1' \
            2>&1 | tee evidence/guest-console.txt
          grep -q '^SEA_NODE_PASS' evidence/guest-console.txt
          {
            echo '### SEA Node integration verification'
            echo '```text'
            grep -E 'PAGE_SIZE=|RESULT |SEA_NODE_' evidence/guest-console.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sea-node-${{ matrix.page }}-evidence
          path: evidence/
          if-no-files-found: error
