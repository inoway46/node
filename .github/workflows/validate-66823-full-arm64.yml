name: Validate 66823 full AArch64 build
on:
  push:
    branches: [validate-66823-full-arm64-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: AArch64 Make Release and QEMU smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
      AR: aarch64-linux-gnu-ar
      CC_host: gcc
      CXX_host: g++
      AR_host: ar
      CC_target: aarch64-linux-gnu-gcc
      CXX_target: aarch64-linux-gnu-g++
      AR_target: aarch64-linux-gnu-ar
      CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      RUSTUP_TOOLCHAIN: 1.88.0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact PR source without additional fixes
        run: |
          set -euxo pipefail
          before=e0619bb7e39092f191685f156449f8783fe712f7
          after=7f6b086b1ae6f2cb056ae1e2608301b438bbf182
          git fetch --no-tags --depth=2 https://github.com/inoway46/node.git "$after"
          test "$(git rev-parse "$after^")" = "$before"
          mkdir -p source results
          git diff --name-only "$before" "$after" > results/changed-files.txt
          printf '%s\n' BUILDING.md configure.py deps/crates/crates.gyp > results/expected-files.txt
          diff -u results/expected-files.txt results/changed-files.txt
          git show -s --format=fuller "$before" "$after" > results/revisions.txt
          git diff "$before" "$after" > results/pr.patch
          git archive "$after" | tar -x -C source
      - name: Install compilers and emulator
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-unknown-linux-gnu
          {
            uname -a
            gcc --version
            g++ --version
            aarch64-linux-gnu-g++ --version
            rustc -vV
            cargo -V
            qemu-aarch64 --version
          } > results/versions.txt
      - name: Configure with bundled Temporal
        working-directory: source
        run: |
          set -euxo pipefail
          ./configure --cross-compiling --dest-os=linux --dest-cpu=arm64 \
            --v8-enable-temporal-support --verbose 2>&1 | tee ../results/configure.log
          cp config.gypi ../results/config.gypi
      - name: Build complete Node.js
        working-directory: source
        run: |
          set -euxo pipefail
          make -j4 V=1 2>&1 | tee ../results/build.log
          file out/Release/node | tee ../results/binary.txt
          readelf -h out/Release/node | tee ../results/node-elf.txt
          sha256sum out/Release/node > ../results/node.sha256
      - name: Run Node.js and Temporal under QEMU
        working-directory: source
        run: |
          set -euxo pipefail
          cat > ../results/smoke.cjs <<'JS'
          'use strict';
          const assert = require('node:assert/strict');
          assert.equal(process.arch, 'arm64');
          assert.equal(typeof Temporal, 'object');
          const date = Temporal.PlainDate.from('2024-02-29');
          assert.equal(date.add({ days: 1 }).toString(), '2024-03-01');
          assert.equal(Temporal.Instant.from('2024-02-29T12:34:56Z').toString(),
                       '2024-02-29T12:34:56Z');
          assert.deepEqual(JSON.parse('{"ok":true}'), { ok: true });
          console.log(JSON.stringify({ version: process.version, arch: process.arch,
                                       temporal: 'passed' }));
          JS
          timeout 120s qemu-aarch64 -L /usr/aarch64-linux-gnu \
            out/Release/node --version 2>&1 | tee ../results/startup.log
          timeout 120s qemu-aarch64 -L /usr/aarch64-linux-gnu \
            out/Release/node ../results/smoke.cjs 2>&1 | tee ../results/smoke.log
          {
            printf 'Full AArch64 Make Release build and QEMU startup/Temporal smoke passed.\n\n'
            printf 'Source: `7f6b086b1ae6f2cb056ae1e2608301b438bbf182`. No additional fixes applied.\n\n'
            printf 'The full Node.js test suite was not run.\n'
          } | tee ../results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: full-arm64-build-results
          path: results/
          retention-days: 90
