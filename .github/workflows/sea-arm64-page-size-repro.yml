name: SEA arm64 page size reproduction

on:
  push:
    branches: [sea-arm64-page-size-repro]
    paths: [.github/workflows/sea-arm64-page-size-repro.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'inoway46/node'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: 16384
            image: debian:trixie
            package: linux-image-arm64-16k
            # v26.9.0's layout happens to work with 16 KiB pages.
            sea_exit: 0
          - page: 65536
            image: ubuntu:24.04
            package: linux-image-generic-64k
            sea_exit: 139
    env:
      EXPECTED_PAGE: ${{ matrix.page }}
      KERNEL_IMAGE: ${{ matrix.image }}
      KERNEL_PACKAGE: ${{ matrix.package }}
      EXPECTED_SEA_EXIT: ${{ matrix.sea_exit }}
    steps:
      - name: Install emulator and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm busybox-static cpio binutils strace
          mkdir -p evidence payload/bin payload/proc payload/sys payload/dev payload/tmp
          uname -a | tee evidence/host.txt
          getconf PAGESIZE | tee -a evidence/host.txt
          test "$(getconf PAGESIZE)" = 4096
          qemu-system-aarch64 --version | tee -a evidence/host.txt

      - name: Download official releases and generate SEA files
        run: |
          set -euxo pipefail
          for version in 26.8.2 26.9.0; do
            mkdir -p "downloads/$version" "payload/$version"
            (
              cd "downloads/$version"
              archive="node-v$version-linux-arm64.tar.xz"
              curl --fail --location --retry 3 -O "https://nodejs.org/dist/v$version/$archive"
              curl --fail --location --retry 3 -O "https://nodejs.org/dist/v$version/SHASUMS256.txt"
              grep "  $archive\$" SHASUMS256.txt > SHA256SUM
              sha256sum --check SHA256SUM
              tar -xJf "$archive" --strip-components=1 "node-v$version-linux-arm64/bin/node"
            )
            cp "downloads/$version/SHA256SUM" "evidence/checksum-$version.txt"
            cp "downloads/$version/bin/node" "payload/$version/node"
            (
              cd "payload/$version"
              printf '%s\n' 'console.log("hello from sea", process.version);' > main.js
              printf '%s\n' '{"main":"main.js","output":"hello","disableExperimentalSEAWarning":true}' > sea.json
              ./node --version
              ./node --build-sea sea.json
              ./hello > host-output.txt
              grep -Fx "hello from sea v$version" host-output.txt
            )
            readelf -hW "payload/$version/node" > "evidence/node-header-$version.txt"
            grep -E 'Type: +EXEC' "evidence/node-header-$version.txt"
            readelf -lW "payload/$version/hello" > "evidence/sea-segments-$version.txt"
            cp "payload/$version/host-output.txt" "evidence/host-output-$version.txt"
          done

      - name: Obtain distribution kernel
        run: |
          set -euxo pipefail
          docker pull "$KERNEL_IMAGE"
          docker image inspect "$KERNEL_IMAGE" > evidence/container-image.json
          docker run --name kernel-source -e DEBIAN_FRONTEND=noninteractive "$KERNEL_IMAGE" \
            sh -euxc 'apt-get update; apt-get install -y --no-install-recommends "$1"; dpkg-query -W' sh "$KERNEL_PACKAGE" \
            2>&1 | tee evidence/kernel-packages.txt
          mkdir kernel
          docker cp kernel-source:/boot/. kernel/
          kernel_path=$(find kernel -maxdepth 1 -name 'vmlinuz-*' | head -n 1)
          test -n "$kernel_path"
          cp "$kernel_path" vmlinuz
          cp kernel/config-* evidence/
          sha256sum vmlinuz | tee evidence/kernel-checksum.txt
          if [ "$EXPECTED_PAGE" = 16384 ]; then
            grep -H '^CONFIG_ARM64_16K_PAGES=y' evidence/config-*
          else
            grep -H '^CONFIG_ARM64_64K_PAGES=y' evidence/config-*
          fi

      - name: Assemble minimal guest initramfs
        run: |
          set -euxo pipefail
          cp /bin/busybox payload/bin/busybox
          for applet in sh mount uname cat poweroff sync timeout dmesg tail grep; do
            ln -s busybox "payload/bin/$applet"
          done
          cp /usr/bin/getconf /usr/bin/strace payload/bin/
          for executable in payload/26.8.2/node payload/26.9.0/node /usr/bin/getconf /usr/bin/strace; do
            ldd "$executable" | tee -a evidence/shared-libraries.txt
            while read -r library; do
              cp --parents -L "$library" payload/
            done < <(ldd "$executable" | awk '/=> \// {print $3} /^[[:space:]]*\// {print $1}')
          done
          printf '%s\n' "$EXPECTED_PAGE" > payload/expected-page
          printf '%s\n' "$EXPECTED_SEA_EXIT" > payload/expected-sea-exit
          cat > payload/init <<'GUEST'
          #!/bin/sh
          export PATH=/bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          ulimit -c 0
          echo SEA_GUEST_BEGIN
          uname -a
          page=$(getconf PAGESIZE)
          expected=$(cat /expected-page)
          echo "PAGE_SIZE=$page EXPECTED=$expected"
          ok=1
          [ "$page" = "$expected" ] || ok=0
          for version in 26.8.2 26.9.0; do
            timeout 60 "/$version/node" --version > /tmp/node.txt 2>&1
            stock_rc=$?
            cat /tmp/node.txt
            [ "$stock_rc" = 0 ] && grep -qx "v$version" /tmp/node.txt || ok=0
            timeout 60 "/$version/hello" > /tmp/sea.txt 2>&1
            sea_rc=$?
            cat /tmp/sea.txt
            echo "RESULT version=$version page=$page stock_exit=$stock_rc sea_exit=$sea_rc"
            if [ "$version" = 26.8.2 ]; then
              [ "$sea_rc" = 0 ] && grep -qx "hello from sea v$version" /tmp/sea.txt || ok=0
            else
              [ "$sea_rc" = "$(cat /expected-sea-exit)" ] || ok=0
              if [ "$sea_rc" = 0 ]; then
                grep -qx "hello from sea v$version" /tmp/sea.txt || ok=0
              fi
              timeout 60 strace -f -e trace=execve "/$version/hello" 2>&1
            fi
          done
          dmesg | tail -n 30
          if [ "$ok" = 1 ]; then
            echo SEA_REPRO_PASS
          else
            echo SEA_REPRO_FAIL
          fi
          sync
          poweroff -f
          GUEST
          chmod +x payload/init
          (cd payload && find . -print0 | cpio --null -o --format=newc --owner=0:0 | gzip -1) > initramfs.cpio.gz

      - name: Boot real large-page kernel and assert version boundary
        run: |
          set -o pipefail
          timeout 600 qemu-system-aarch64 \
            -machine virt -cpu max -accel tcg -smp 2 -m 2048 \
            -nographic -no-reboot -nic none \
            -kernel vmlinuz -initrd initramfs.cpio.gz \
            -append 'console=ttyAMA0 rdinit=/init panic=-1' \
            2>&1 | tee evidence/guest-console.txt
          grep -q '^SEA_REPRO_PASS' evidence/guest-console.txt
          {
            echo '### SEA regression boundary'
            echo '```text'
            grep -E 'PAGE_SIZE=|RESULT |SEA_REPRO_' evidence/guest-console.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sea-arm64-${{ matrix.page }}-evidence
          path: evidence/
          if-no-files-found: error
