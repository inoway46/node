# Fork-only validation for successive pushes to a draft PR.
name: Test Shared libraries

on:
  pull_request:
    branches: [ci/macos-v8-nar-base]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-tarball:
    name: Build slim tarball
    timeout-minutes: 360
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Make tarball
        run: |
          export DATESTRING=$(date "+%Y-%m-%d")
          export COMMIT=$(git rev-parse --short=10 "$GITHUB_SHA")
          ./configure && make tar -j4 SKIP_XZ=1 SKIP_SHARED_DEPS=1 GZIP_COMPRESSION=6
        env:
          DISTTYPE: nightly

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: '*.tar.gz'
          archive: false

  build:
    needs: build-tarball
    uses: ./.github/workflows/build-shared.yml
    with:
      runner: macos-latest
      with-sccache: true
