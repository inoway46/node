name: Validate tarball gzip optimization

on:
  push:
    branches: [codex/validate-tarball-gzip]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  NODE_VERSION: lts/*

permissions:
  contents: read

jobs:
  build-tarball:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        level: [6, 9]
        repetition: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Make tarball
        env:
          LEVEL: ${{ matrix.level }}
        run: |
          export DISTTYPE=nightly
          export DATESTRING=$(date "+%Y-%m-%d")
          export COMMIT=$(git rev-parse --short=10 "$GITHUB_SHA")
          mkdir -p "$RUNNER_TEMP/timed-bin"
          printf '%s\n' '#!/bin/sh' 'exec /usr/bin/time -f "GZIP_SECONDS=%e USER=%U SYS=%S" /usr/bin/gzip "$@"' > "$RUNNER_TEMP/timed-bin/gzip"
          chmod +x "$RUNNER_TEMP/timed-bin/gzip"
          export PATH="$RUNNER_TEMP/timed-bin:$PATH"
          extra_args=()
          if [ "$LEVEL" = 6 ]; then
            extra_args=(GZIP_COMPRESSION=6)
          fi
          ./configure
          /usr/bin/time -f "MAKE_TAR_SECONDS=%e" make tar -j4 SKIP_XZ=1 "${extra_args[@]}"
          gzip -t ./*.tar.gz
          stat --format="TARBALL_BYTES=%s" ./*.tar.gz
      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tarball-${{ matrix.level }}-${{ matrix.repetition }}
          path: '*.tar.gz'
          archive: false
  test-tarball-linux:
    needs: build-tarball
    runs-on: ubuntu-24.04-arm
    env:
      CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
      CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
      SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - name: Install Clang ${{ env.CLANG_VERSION }}
        uses: $/.github/actions/install-clang
        with:
          clang-version: ${{ env.CLANG_VERSION }}
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Set up sccache
        if: github.base_ref == 'main' || github.ref_name == 'main'
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.17.0
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tarball-6-1
          path: tarballs
      - name: Extract tarball
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"
      - name: Build
        run: make -C "$TAR_DIR" build-ci -j4 V=1
      - name: Test
        run: make -C "$TAR_DIR" test-ci -j1 V=1 TEST_CI_ARGS="-p dots --measure-flakiness 9"
