name: Compare CodeQL runners

on:
  push:
    branches: [codeql-runner-benchmark]

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'inoway46/node'
    name: Analyze (${{ matrix.runner }}, ${{ matrix.language }}, ${{ matrix.trial }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-latest]
        language: [cpp]
        trial: [1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nodejs/node
          ref: ae353ec38d57385e8b06cc14521ef75718cdd86c
          persist-credentials: false

      - name: Record environment
        run: |
          git rev-parse HEAD
          uname -a
          cat /etc/os-release
          nproc
          free -m
          df -h .
          gcc --version
          python3 --version
          node --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          config-file: ./.github/codeql-config.yml
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux64.tar.zst

      - name: Build Node.js
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY' &
          import datetime
          import pathlib
          import subprocess
          import time

          with open("resources.log", "w", buffering=1) as log:
              while True:
                  parts = ["Resource sample: " + datetime.datetime.now(datetime.timezone.utc).isoformat()]
                  for command in (
                      ["uptime"],
                      ["free", "-m"],
                      ["df", "-h", ".", "/tmp"],
                      ["ps", "-eo", "pid,ppid,comm,rss,%cpu", "--sort=-rss"],
                  ):
                      try:
                          result = subprocess.run(command, capture_output=True, text=True, timeout=10)
                          output = result.stdout + result.stderr
                          if command[0] == "ps":
                              output = "\n".join(output.splitlines()[:16]) + "\n"
                          parts.append(output)
                      except Exception as error:
                          parts.append(str(error))
                  for metric in ("memory.current", "memory.peak", "memory.max", "memory.events"):
                      path = pathlib.Path("/sys/fs/cgroup") / metric
                      try:
                          parts.append(metric + ":\n" + path.read_text())
                      except OSError:
                          pass
                  sample = "\n".join(parts)
                  print(sample, flush=True)
                  log.write(sample + "\n")
                  time.sleep(60)
          PY
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          ./configure 2>&1 | tee configure.log
          make -j3 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            configure.log
            build.log
            resources.log

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:${{ matrix.language }}/runner:${{ matrix.runner }}
          upload: never
          upload-database: false
