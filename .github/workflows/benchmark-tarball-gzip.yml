# Fork-only experiment; not part of the upstream runner-change PR.
name: Benchmark tarball gzip - 64 per level

on:
  push:
    branches: [codex/benchmark-gzip-64]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: lts/*
  DISTTYPE: nightly
  DATESTRING: '2026-09-23'

jobs:
  build-tarball:
    name: gzip-${{ matrix.level }} / sample-${{ matrix.sample }}
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {level: 9, sample: 1}
          - {level: 6, sample: 1}
