name: PR 65194 all debugger tests (pr-base)

on:
  push:
    branches:
      - stress/pr-65194-exceptions

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  XCODE_VERSION: '16.4'
  RUSTC_VERSION: '1.86'

jobs:
  stress-test:
    name: pr-base-all-debugger
    runs-on: macos-15
    env:
      CC: sccache gcc
      CXX: sccache g++
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
      LOG_DIR: ${{ github.workspace }}/workflow-logs

    steps:
      - name: Check out pr-base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: nodejs/node
          ref: 821e2675e3b9b6fd2359a829abeff034836c37ab
          persist-credentials: false
          path: node

      - name: Verify source revision
        env:
          EXPECTED_SHA: 821e2675e3b9b6fd2359a829abeff034836c37ab
        run: |
          actual_sha="$(git -C node rev-parse HEAD)"
          echo "expected_sha=$EXPECTED_SHA"
          echo "actual_sha=$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        run: |
          rustup override set "$RUSTC_VERSION"
          rustup --version

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
        with:
          version: v0.16.0

      - name: Clean up runner disk
        run: sudo rm -rf /Users/runner/Library/Android/sdk

      - name: Build
        run: make -C node build-ci -j2 V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support"

      - name: Run all debugger tests x100
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          cd node

          debugger_tests=()
          for test_file in \
            test/parallel/test-debugger-*.js \
            test/parallel/test-debugger-*.mjs \
            test/sequential/test-debugger-*.js \
            test/sequential/test-debugger-*.mjs; do
            test -e "$test_file" || continue
            test "$test_file" = \
              test/parallel/test-debugger-profile-command.js && continue
            test_path="${test_file#test/}"
            test_path="${test_path%.js}"
            test_path="${test_path%.mjs}"
            debugger_tests+=("$test_path")
          done

          echo "Running ${#debugger_tests[@]} debugger tests x100 with -j16"
          test "${#debugger_tests[@]}" -eq 79
          python3 tools/test.py \
            --repeat 100 \
            -j 16 \
            -p actions \
            --report \
            --time \
            "${debugger_tests[@]}" \
            2>&1 | tee "$LOG_DIR/debugger-tests.log"
          debugger_status=${PIPESTATUS[0]}

          echo "Running test-debugger-profile-command x100 with -j1"
          python3 tools/test.py \
            --repeat 100 \
            -j 1 \
            -p actions \
            --report \
            --time \
            parallel/test-debugger-profile-command \
            2>&1 | tee "$LOG_DIR/debugger-profile-command.log"
          profile_status=${PIPESTATUS[0]}

          test "$debugger_status" -eq 0 && test "$profile_status" -eq 0

      - name: Upload stress-test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-65194-all-debugger-pr-base
          path: ${{ env.LOG_DIR }}
