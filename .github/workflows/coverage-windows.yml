name: Coverage Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-nightly-coverage:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NIGHTLY_VERSION: v27.0.0-nightly202610161c90519c1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 1c90519c1a878499d1942f61eeec68dd8de457d7
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Download official nightly without building
        shell: pwsh
        run: |
          $base = "https://nodejs.org/download/nightly/$env:NIGHTLY_VERSION"
          New-Item -ItemType Directory -Force Release | Out-Null
          Invoke-WebRequest "$base/win-x64/node.exe" -OutFile Release/node.exe
          $checksums = (Invoke-WebRequest "$base/SHASUMS256.txt").Content
          $line = @($checksums -split "`n" | Where-Object { $_ -match '\s+win-x64/node\.exe\s*$' })
          if ($line.Count -ne 1) { throw 'Expected exactly one official checksum' }
          $expected = ($line[0].Trim() -split '\s+')[0]
          $actual = (Get-FileHash Release/node.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Nightly checksum mismatch' }
          $version = (& ./Release/node.exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne $env:NIGHTLY_VERSION) {
            throw "Unexpected nightly version: $version"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'nightly-binary'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item Release/node.exe $dir
          $info = [ordered]@{
            version = $version
            sourceSha = (git rev-parse HEAD).Trim()
            binarySha256 = $actual
            downloadUrl = "$base/win-x64/node.exe"
          }
          $info | ConvertTo-Json | Set-Content "$dir/nightly-info.json"
          "Nightly: $version; verified SHA256: $actual" >> $env:GITHUB_STEP_SUMMARY
      - name: Save nightly binary for reuse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-windows-binary-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-binary
          retention-days: 30
          if-no-files-found: error
      - name: Confirm baseline and apply proposed test fix
        shell: pwsh
        env:
          PROPOSAL_SHA: ${{ github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $binary = (Resolve-Path Release/node.exe).Path
          $test = 'parallel/test-util-getcallsites-sourcemap'
          foreach ($mode in @('off', 'on')) {
            Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
            if ($mode -eq 'on') {
              $env:NODE_V8_COVERAGE = Join-Path $env:RUNNER_TEMP 'sourcemap-baseline-coverage'
            }
            $output = & python tools/test.py --shell $binary --mode release -j 1 -p tap $test 2>&1 | Out-String
            $baselineExit = $LASTEXITCODE
            Write-Output "BASELINE coverage=$mode exit=$baselineExit"
            Write-Output $output
            if ($mode -eq 'off' -and $baselineExit -ne 0) { throw 'Baseline without coverage failed' }
            if ($mode -eq 'on' -and ($baselineExit -eq 0 -or $output -notmatch 'expected generated file in scriptName')) {
              throw 'Baseline did not reproduce the expected source map failure'
            }
          }
          Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
          git checkout $env:PROPOSAL_SHA -- test/parallel/test-util-getcallsites-sourcemap.js
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply proposed test file' }
          git diff --cached -- test/parallel/test-util-getcallsites-sourcemap.js
      - name: Verify fixed test in both coverage modes
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $binary = (Resolve-Path Release/node.exe).Path
          $initialHash = (Get-FileHash $binary -Algorithm SHA256).Hash
          $resultsDir = Join-Path $env:RUNNER_TEMP 'coverage-comparison'
          New-Item -ItemType Directory -Force $resultsDir | Out-Null
          $tests = @('parallel/test-util-getcallsites-sourcemap')
          $sha = (git rev-parse HEAD).Trim()
          "Source: $sha`nBinary SHA256: $initialHash" | Set-Content "$resultsDir/provenance.txt"
          "Source: $sha; binary SHA256: $initialHash" >> $env:GITHUB_STEP_SUMMARY
          '| Round | Coverage | Test | Exit code | Seconds |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- | --- | --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          $rows = @()
          foreach ($round in 1..3) {
            foreach ($mode in @('off', 'on')) {
              foreach ($test in $tests) {
                $name = $test.Replace('/', '-')
                $case = "$round-$mode-$name"
                Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
                if ($mode -eq 'on') {
                  $env:NODE_V8_COVERAGE = Join-Path $env:RUNNER_TEMP "coverage-$case"
                }
                $timer = [Diagnostics.Stopwatch]::StartNew()
                $output = & python tools/test.py --shell $binary --mode release -j 1 -p tap $test 2>&1 | Out-String
                $testExit = $LASTEXITCODE
                $timer.Stop()
                $output | Set-Content "$resultsDir/$case.log"
                Write-Output "CASE $case exit=$testExit"
                Write-Output $output
                if ((Get-FileHash $binary -Algorithm SHA256).Hash -ne $initialHash) {
                  throw 'The binary changed between test executions'
                }
                $seconds = [math]::Round($timer.Elapsed.TotalSeconds, 2)
                "| $round | $mode | $test | $testExit | $seconds |" >> $env:GITHUB_STEP_SUMMARY
                $rows += [pscustomobject]@{
                  round = $round; coverage = $mode; test = $test
                  exitCode = $testExit; seconds = $seconds; binarySha256 = $initialHash
                }
                if ($mode -eq 'on') {
                  Remove-Item $env:NODE_V8_COVERAGE -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
            }
          }
          Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
          $rows | ConvertTo-Json | Set-Content "$resultsDir/results.json"
          if (@($rows | Where-Object { $_.exitCode -ne 0 }).Count -ne 0) {
            throw 'The fixed test failed in at least one comparison run'
          }
          exit 0
      - name: Save comparison logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-coverage-comparison
          path: ${{ runner.temp }}/coverage-comparison
          if-no-files-found: warn
