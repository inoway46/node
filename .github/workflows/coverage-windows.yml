name: Coverage Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-coverage:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: bc5af1c67cd8e029f86ec992688dde9307f4d61a
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install deps
        run: choco install nasm
      - name: Install Rust
        run: |
          rustup override set 1.88
          rustup --version
      - name: Build once
        run: ./vcbuild.bat clang-cl v8temporal
      - name: Prepare reusable Windows binary
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'windows-test-binary'
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          Copy-Item Release/node.exe $artifactDir
          foreach ($file in @('Release/node.pdb', 'config.gypi')) {
            if (Test-Path $file) { Copy-Item $file $artifactDir }
          }
          if (Test-Path .used_configure_flags) {
            Copy-Item .used_configure_flags "$artifactDir/used-configure-flags.txt"
          }
          $metadata = [ordered]@{
            sourceSha = (git rev-parse HEAD).Trim()
            binarySha256 = (Get-FileHash Release/node.exe -Algorithm SHA256).Hash
            buildCommand = './vcbuild.bat clang-cl v8temporal'
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            runId = $env:GITHUB_RUN_ID
          }
          $metadata | ConvertTo-Json | Set-Content "$artifactDir/build-info.json"
      - name: Save reusable Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-test-binary-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-test-binary
          retention-days: 30
          if-no-files-found: error
      - name: Compare four tests with the same binary
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $binary = (Resolve-Path Release/node.exe).Path
          $initialHash = (Get-FileHash $binary -Algorithm SHA256).Hash
          $resultsDir = Join-Path $env:RUNNER_TEMP 'coverage-comparison'
          New-Item -ItemType Directory -Force $resultsDir | Out-Null
          $tests = @(
            'es-module/test-vm-source-text-module-leak',
            'parallel/test-child-process-exec-any-shells-windows',
            'parallel/test-inspector-wait-for-connection',
            'parallel/test-util-getcallsites-sourcemap'
          )
          $sha = (git rev-parse HEAD).Trim()
          "Source: $sha`nBinary SHA256: $initialHash" | Set-Content "$resultsDir/provenance.txt"
          "Source: $sha; binary SHA256: $initialHash" >> $env:GITHUB_STEP_SUMMARY
          '| Round | Coverage | Test | Exit code | Seconds |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- | --- | --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          $rows = @()
          foreach ($round in 1..3) {
            foreach ($mode in @('off', 'on')) {
              foreach ($test in $tests) {
                $name = $test.Replace('/', '-')
                $case = "$round-$mode-$name"
                Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
                if ($mode -eq 'on') {
                  $env:NODE_V8_COVERAGE = Join-Path $env:RUNNER_TEMP "coverage-$case"
                }
                $timer = [Diagnostics.Stopwatch]::StartNew()
                $output = & python tools/test.py --shell $binary --mode release -j 1 -p tap $test 2>&1 | Out-String
                $testExit = $LASTEXITCODE
                $timer.Stop()
                $output | Set-Content "$resultsDir/$case.log"
                Write-Output "CASE $case exit=$testExit"
                Write-Output $output
                if ((Get-FileHash $binary -Algorithm SHA256).Hash -ne $initialHash) {
                  throw 'The binary changed between test executions'
                }
                $seconds = [math]::Round($timer.Elapsed.TotalSeconds, 2)
                "| $round | $mode | $test | $testExit | $seconds |" >> $env:GITHUB_STEP_SUMMARY
                $rows += [pscustomobject]@{
                  round = $round; coverage = $mode; test = $test
                  exitCode = $testExit; seconds = $seconds; binarySha256 = $initialHash
                }
                if ($mode -eq 'on') {
                  Remove-Item $env:NODE_V8_COVERAGE -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
            }
          }
          Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
          $rows | ConvertTo-Json | Set-Content "$resultsDir/results.json"
          # This diagnostic job records test failures rather than gating on them.
          exit 0
      - name: Save comparison logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-coverage-comparison
          path: ${{ runner.temp }}/coverage-comparison
          if-no-files-found: warn
