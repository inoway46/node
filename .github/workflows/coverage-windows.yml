name: Coverage Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-missing-sources:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        strict: [false, true]
        revision:
          - label: before-66531
            sha: c3189d436e14202a764d59aa35526ef9c44d9f6b
            headers: cpp-heap-external-object-inl.h;primitive-heap-object-inl.h;stl_type_traits.h
          - label: before-66583
            sha: a0ce8f152bb1536b2c06dcfcc69db080bcdb6cd5
            headers: stl_type_traits.h
    name: ${{ matrix.revision.label }} / strict=${{ matrix.strict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ matrix.revision.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install deps
        run: choco install nasm
      - name: Install Rust
        run: |
          rustup override set 1.88
          rustup --version
      - name: Verify historical GYP generation
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ matrix.revision.sha }}
          EXPECTED_HEADERS: ${{ matrix.revision.headers }}
          STRICT: ${{ matrix.strict }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $env:EXPECTED_SHA) {
            throw "Unexpected checkout: $actualSha"
          }
          $strict = $env:STRICT -eq 'true'
          if ($strict) {
            $env:config_flags = '-Gmsvs_error_on_missing_sources=1'
          } else {
            Remove-Item Env:config_flags -ErrorAction SilentlyContinue
          }
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & cmd /d /c 'vcbuild.bat projgen nobuild clang-cl v8temporal' 2>&1 | Out-String
          $generationExit = $LASTEXITCODE
          Write-Output $output
          Write-Output "GYP generation exit code: $generationExit"
          "SHA: $actualSha; strict: $strict; generation exit: $generationExit" >> $env:GITHUB_STEP_SUMMARY
          if ($output -notmatch 'Missing input files:') {
            throw 'The expected missing-source diagnostic was not emitted'
          }
          foreach ($header in $env:EXPECTED_HEADERS.Split(';')) {
            if (-not $output.Contains($header)) {
              throw "Missing expected diagnostic for $header"
            }
          }
          if ($strict) {
            if ($generationExit -eq 0 -or $output -notmatch 'gyp: Missing input files:') {
              throw 'Strict mode did not fail with the expected GYP error'
            }
          } elseif ($generationExit -ne 0) {
            throw 'Baseline generation failed instead of warning successfully'
          }
          exit 0
