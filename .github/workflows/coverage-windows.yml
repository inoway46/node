name: Coverage Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix-missing-sources:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        generator: [ninja, make]
        revision:
          - label: before-66531
            sha: c3189d436e14202a764d59aa35526ef9c44d9f6b
            expected: cpp-heap-external-object-inl.h;primitive-heap-object-inl.h;stl_type_traits.h
          - label: before-66583
            sha: a0ce8f152bb1536b2c06dcfcc69db080bcdb6cd5
            expected: stl_type_traits.h
          - label: main
            sha: bc5af1c67cd8e029f86ec992688dde9307f4d61a
            expected: ''
    name: ${{ matrix.revision.label }} / ${{ matrix.generator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ matrix.revision.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Probe existing checker during generation without editing source
        env:
          CHECK_GENERATOR: ${{ matrix.generator }}
          EXPECTED_SHA: ${{ matrix.revision.sha }}
          EXPECTED_HEADERS: ${{ matrix.revision.expected }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PYTHON'
          import os, sys, runpy
          sys.path.insert(0, os.path.abspath('tools/gyp/pylib'))
          from gyp.generator import msvs, ninja, make
          missing_sources, missing_actions, skipped = set(), set(), set()
          def inspect(spec, base):
              sources = spec.get('sources', [])
              inputs = [p for a in spec.get('actions', []) for p in a.get('inputs', [])]
              inputs += [p for c in spec.get('copies', []) for p in c.get('files', [])]
              missing_sources.update(os.path.normpath(p) for p in msvs._VerifySourcesExist(sources, base))
              missing_actions.update(os.path.normpath(p) for p in msvs._VerifySourcesExist(inputs, base))
              skipped.update(p for p in sources + inputs if '$' in p)
          original_ninja = ninja.NinjaWriter.WriteSpec
          def check_ninja(self, spec, config_name, generator_flags):
              inspect(spec, self.base_dir)
              return original_ninja(self, spec, config_name, generator_flags)
          ninja.NinjaWriter.WriteSpec = check_ninja
          original_make = make.MakefileWriter.Write
          def check_make(self, qualified_target, base_path, output_filename, spec, configs, part_of_all):
              inspect(spec, base_path)
              return original_make(self, qualified_target, base_path, output_filename, spec, configs, part_of_all)
          make.MakefileWriter.Write = check_make
          sys.argv = ['configure'] + (['--ninja'] if os.environ['CHECK_GENERATOR'] == 'ninja' else [])
          runpy.run_path('configure', run_name='__main__')
          print('Missing sources:', sorted(missing_sources))
          print('Missing action/copy inputs:', sorted(missing_actions))
          print('Unverified variable paths:', len(skipped))
          expected = set(filter(None, os.environ['EXPECTED_HEADERS'].split(';')))
          actual = {os.path.basename(p) for p in missing_sources | missing_actions}
          assert actual == expected, (actual, expected)
          print('PASS: observed missing paths match expected historical state')
          PYTHON
