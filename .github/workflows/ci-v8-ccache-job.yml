# Fork-only throwaway workflow (inoway46/node); not for upstream.
# One phase of the V8 ccache experiment; called from ci-v8-ccache.yml.
#
# phase:   cold | warm-trivial | warm-pr66823 | plain-check
#          (plain-check rebuilds the no-ccache V8 with `nix-build --check`
#          and compares it with the copy from nodejs.cachix.org)
# variant: default | g0 (ccache build with -g0, separate cache key)
name: CI V8 ccache job

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      system:
        required: true
        type: string
      phase:
        required: true
        type: string
      variant:
        required: false
        type: string
        default: default

permissions:
  contents: read

env:
  CCACHE_HOST_DIR: /nix/var/cache/ccache

jobs:
  v8:
    name: ${{ inputs.phase }}${{ inputs.variant != 'default' && format(' ({0})', inputs.variant) || '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 358
    env:
      SYSTEM: ${{ inputs.system }}
      PHASE: ${{ inputs.phase }}
      VARIANT: ${{ inputs.variant }}
      ATTR: ${{ inputs.variant == 'g0' && 'ccacheG0' || 'ccache' }}
      CACHE_PREFIX: ccache-v8-${{ inputs.variant == 'g0' && 'g0-' || '' }}${{ inputs.system }}-
      CACHE_KEY: ccache-v8-${{ inputs.variant == 'g0' && 'g0-' || '' }}${{ inputs.system }}-${{ github.run_id }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci-v8-ccache
          path: experiment

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: tarballs
          pattern: '*.tar.gz'
          merge-multiple: true

      - name: Extract tarball
        shell: bash
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        with:
          extra_nix_config: |
            sandbox = true
            extra-sandbox-paths = ${{ env.CCACHE_HOST_DIR }}

      - name: Create ccache dir writable by nixbld users
        # Must exist before the first build (extra-sandbox-paths).
        run: |
          sudo install -d -m 0777 "$CCACHE_HOST_DIR"
          # actions/cache restores as the runner user; tar must be able to chmod/utime the dir.
          sudo chown "$(id -u):$(id -g)" "$CCACHE_HOST_DIR"
          ls -ld "$CCACHE_HOST_DIR"

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: nodejs

      - name: Restore ccache (warm phases only)
        if: startsWith(inputs.phase, 'warm')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ${{ env.CACHE_KEY }}
          # A "[warm-only]" run restores the cold cache saved by an earlier run of this branch.
          restore-keys: ${{ env.CACHE_PREFIX }}
          fail-on-cache-miss: true

      - name: Fix permissions after restore
        run: |
          sudo chmod -R a+rwX "$CCACHE_HOST_DIR"
          du -sh "$CCACHE_HOST_DIR"

      - name: Modify the tarball for this phase
        run: |
          case "$PHASE" in
            cold|plain-check) ;;
            warm-trivial)
              printf '\n# ccache experiment: trivial change that alters the V8 derivation hash.\n' >> "$TAR_DIR/configure.py" ;;
            warm-pr66823)
              # The slim tarball may not contain every patched file (e.g. deps/crates).
              PATCH="$PWD/experiment/.github/ci-v8-ccache/pr66823.diff"
              excl=()
              for f in $(sed -n 's|^+++ b/||p' "$PATCH"); do
                [ -e "$TAR_DIR/$f" ] || { echo "RESULT patch: $f not in tarball, skipped"; excl+=(--exclude="$f"); }
              done
              (cd "$TAR_DIR" && git apply -v "${excl[@]}" "$PATCH") ;;
          esac

      - name: Evaluate derivations
        run: |
          NIX="experiment/.github/ci-v8-ccache/v8-ccache.nix"
          eval_out() { nix-store -q --outputs "$(nix-instantiate "$NIX" --argstr tarDir "$1" -A "$2")"; }
          # Reference: no-ccache V8 for the *unmodified* tarball (what upstream CI caches).
          mkdir -p "$RUNNER_TEMP/orig"
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP/orig"
          ORIG_DIR="$RUNNER_TEMP/orig/$(basename "$TAR_DIR")"
          REF_OUT=$(eval_out "$ORIG_DIR" plain)
          PLAIN_OUT=$(eval_out "$TAR_DIR" plain)
          CCACHE_OUT=$(eval_out "$TAR_DIR" "$ATTR")
          REF_NARINFO=$(curl -ISsw "%{http_code}" -o /dev/null "https://nodejs.cachix.org/$(basename "${REF_OUT%-v8-*}").narinfo")
          PLAIN_NARINFO=$(curl -ISsw "%{http_code}" -o /dev/null "https://nodejs.cachix.org/$(basename "${PLAIN_OUT%-v8-*}").narinfo")
          {
            echo "NIX=$NIX"
            echo "ORIG_DIR=$ORIG_DIR"
            echo "REF_OUT=$REF_OUT"
            echo "REF_NARINFO=$REF_NARINFO"
            echo "PLAIN_OUT=$PLAIN_OUT"
            echo "PLAIN_NARINFO=$PLAIN_NARINFO"
            echo "CCACHE_OUT=$CCACHE_OUT"
          } | tee -a "$GITHUB_ENV" | sed 's/^/RESULT /'
          echo "CCACHE_BIN=$(nix-build --no-out-link "$NIX" --argstr tarDir "$TAR_DIR" -A ccacheBin)/bin/ccache" >> "$GITHUB_ENV"

      - name: Probe ccache inside the sandbox
        if: inputs.phase != 'plain-check'
        run: |
          # Each pair compiles the same file in two derivations (two build dirs).
          probe() {
            local dir="$CCACHE_HOST_DIR/$1"
            install -d -m 0777 "$dir"
            # Sequentially, so the second compile can hit the first one's entry.
            nix-build --no-out-link "$NIX" --argstr tarDir "$TAR_DIR" -A "$2" > /dev/null
            nix-build --no-out-link "$NIX" --argstr tarDir "$TAR_DIR" -A "$3" > /dev/null
            local s; s=$(env CCACHE_DIR="$dir" "$CCACHE_BIN" --print-stats)
            get() { awk -v k="$1" '$1 == k { v = $2 } END { print v + 0 }' <<<"$s"; }
            echo "RESULT probe $1: hits=$(( $(get direct_cache_hit) + $(get preprocessed_cache_hit) )) misses=$(get cache_miss)"
          }
          probe probe probeA probeB | tee probe.txt
          probe probe-g probeGA probeGB | tee -a probe.txt
          probe probe-g-nohashdir probeGNA probeGNB | tee -a probe.txt
          grep -q 'probe probe: hits=1 ' probe.txt || { echo "::error::ccache probe did not hit"; exit 1; }
          rm -rf "$CCACHE_HOST_DIR"/probe*
          env CCACHE_DIR="$CCACHE_HOST_DIR" CCACHE_UMASK=000 "$CCACHE_BIN" -z

      - name: Build V8
        id: build
        run: |
          start=$(date +%s)
          stats() { env CCACHE_DIR="$CCACHE_HOST_DIR" "$CCACHE_BIN" --print-stats | awk -v k="$1" '$1 == k { v = $2 } END { print v + 0 }'; }
          if [ "$PHASE" = plain-check ]; then
            # Rebuild the no-ccache V8 and let Nix compare it with the substituted copy.
            nix-store -r "$REF_OUT" > /dev/null
            cmd=(nix-build --check --keep-failed --no-out-link "$NIX" --argstr tarDir "$ORIG_DIR" -A plain)
          else
            cmd=(nix-build --no-out-link "$NIX" --argstr tarDir "$TAR_DIR" -A "$ATTR")
          fi
          # Stop before the 6h job limit so the ccache dir is still saved.
          perl -e 'alarm shift; exec @ARGV' $((320 * 60)) "${cmd[@]}" > build.log 2>&1 &
          pid=$!
          # Warm phases: give up early if ccache clearly does not hit.
          while kill -0 "$pid" 2>/dev/null; do
            sleep 60
            elapsed=$(( $(date +%s) - start ))
            if [ "$PHASE" != cold ] && [ "$PHASE" != plain-check ] && [ "$elapsed" -ge 1200 ]; then
              hits=$(( $(stats direct_cache_hit) + $(stats preprocessed_cache_hit) )); misses=$(stats cache_miss)
              if [ "$misses" -ge 100 ] && [ $(( hits * 4 )) -lt "$misses" ]; then
                echo "RESULT early abort after $((elapsed / 60)) min: hits=$hits misses=$misses"
                echo "EARLY_ABORT=$((elapsed / 60)) min, hits=$hits misses=$misses" >> "$GITHUB_ENV"
                kill "$pid" || true
                break
              fi
            fi
          done
          status=0; wait "$pid" 2>/dev/null || status=$?
          tail -n 40 build.log
          echo "BUILD_MIN=$(( ($(date +%s) - start + 30) / 60 ))" >> "$GITHUB_ENV"
          echo "BUILD_STATUS=$status" >> "$GITHUB_ENV"
          if [ "$PHASE" = plain-check ]; then
            if [ "$status" = 0 ]; then
              echo "RESULT plain-check: rebuild is bit-identical to the cachix copy"
              echo "COMPARE_RESULT=true (nix --check)" >> "$GITHUB_ENV"
            elif [ -e "$REF_OUT.check" ]; then
              echo "RESULT plain-check: rebuild differs from the cachix copy"
              echo "CHECK_OUT=$REF_OUT.check" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          exit "$status"

      - name: ccache statistics
        if: ${{ !cancelled() && env.CCACHE_BIN != '' && inputs.phase != 'plain-check' }}
        run: |
          sudo chmod -R a+rwX "$CCACHE_HOST_DIR"
          env CCACHE_DIR="$CCACHE_HOST_DIR" CCACHE_UMASK=000 "$CCACHE_BIN" -s -v | tee ccache-stats.txt
          env CCACHE_DIR="$CCACHE_HOST_DIR" CCACHE_UMASK=000 "$CCACHE_BIN" --print-stats > ccache-print-stats.txt
          get() { awk -v k="$1" '$1 == k { v = $2 } END { print v + 0 }' ccache-print-stats.txt; }
          hits=$(( $(get direct_cache_hit) + $(get preprocessed_cache_hit) ))
          misses=$(get cache_miss)
          rate=$(awk -v h="$hits" -v m="$misses" 'BEGIN { if (h + m) printf "%.1f", 100 * h / (h + m); else print "n/a" }')
          size=$(du -sm "$CCACHE_HOST_DIR" | cut -f1)
          echo "CCACHE_HITS=$hits" >> "$GITHUB_ENV"
          echo "CCACHE_MISSES=$misses" >> "$GITHUB_ENV"
          echo "CCACHE_RATE=$rate" >> "$GITHUB_ENV"
          echo "CCACHE_MB=$size" >> "$GITHUB_ENV"
          echo "RESULT ccache hits=$hits misses=$misses rate=$rate% dir=${size}MB"

      - name: Compare with the no-ccache V8 from nodejs.cachix.org
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || env.CHECK_OUT != '') && env.EARLY_ABORT == '' }}
        run: |
          if [ "$REF_NARINFO" != 200 ]; then
            echo "RESULT compare skipped: reference not in cachix"
            echo "COMPARE_RESULT=n/a (ref not cached)" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$PHASE" = plain-check ]; then
            [ -n "${CHECK_OUT:-}" ] || exit 0
            OTHER="$CHECK_OUT"
          else
            OTHER="$CCACHE_OUT"
          fi
          nix-store -r "$REF_OUT" > /dev/null
          python3 experiment/.github/ci-v8-ccache/manifest.py compare "$REF_OUT" "$OTHER" diff-members | tee compare.txt
          echo "COMPARE_RESULT=$(grep -o 'identical_content=[a-z]*' compare.txt | cut -d= -f2) ($(grep -o 'members_diff=[0-9]*' compare.txt | cut -d= -f2) members differ)" >> "$GITHUB_ENV"
          du -sh "$OTHER" "$REF_OUT"
          # What differs inside the first few differing objects (a = cachix, b = this build).
          if [ -d diff-members/a ] && [ "$(uname)" = Darwin ]; then
            find diff-members/a -type f | sort | head -n 6 | while read -r a; do
              b="diff-members/b/${a#diff-members/a/}"
              echo "== ${a#diff-members/a/}: $(cmp -l "$a" "$b" | wc -l | tr -d ' ') bytes differ, sizes $(wc -c < "$a" | tr -d ' ')/$(wc -c < "$b" | tr -d ' ')"
              diff <(size -m "$a" 2>&1 | sed 1d) <(size -m "$b" 2>&1 | sed 1d) | head -n 8 || true
              diff <(strings -a "$a" | sort -u) <(strings -a "$b" | sort -u) | head -n 8 || true
            done 2>&1 | tee diff-details.txt
          fi

      - name: Save ccache (cold phase only)
        if: ${{ always() && inputs.phase == 'cold' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ${{ env.CACHE_KEY }}

      - name: Summary
        if: ${{ always() }}
        run: |
          job_min=$(( ($(date +%s) - JOB_START + 30) / 60 ))
          line="| $SYSTEM | $PHASE ($VARIANT) | ${BUILD_MIN:-?} | $job_min | ${BUILD_STATUS:-?} | ${CCACHE_HITS:-?} / ${CCACHE_MISSES:-?} (${CCACHE_RATE:-?}%) | ${CCACHE_MB:-?} | ${COMPARE_RESULT:-?} | ${EARLY_ABORT:-} |"
          echo "RESULT-ROW $line"
          {
            echo "| system | phase | V8 build min | job min | exit | ccache hits / misses | ccache dir MB | same output as no-ccache build | early abort |"
            echo "|---|---|---|---|---|---|---|---|---|"
            echo "$line"
            echo
            echo "- ref (no ccache, unmodified): \`$REF_OUT\` narinfo $REF_NARINFO"
            echo "- plain (no ccache, this phase): \`$PLAIN_OUT\` narinfo $PLAIN_NARINFO"
            echo "- ccache (this phase): \`$CCACHE_OUT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: logs-${{ inputs.system }}-${{ inputs.phase }}-${{ inputs.variant }}
          retention-days: 7
          path: |
            build.log
            probe.txt
            ccache-stats.txt
            compare.txt
            diff-details.txt
            diff-members
          if-no-files-found: ignore
