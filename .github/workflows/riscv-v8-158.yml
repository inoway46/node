# Fork-only throwaway workflow. Not for upstream; do not include in any PR.
#
# Cross-builds the head of nodejs/node#67070 (V8 15.8.62.44) for riscv64
# rv64gc with GCC 15.3.0, to check that Highway's scalar fallback compiles
# without forcing EMU128, then smoke-tests the result under non-RVV QEMU.
name: RISC-V V8 15.8 cross-build
on:
  push:
    branches: [ci/riscv-v8-158]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-build:
    name: full-build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # pr-head: #67070 as is.
        # mutable-page-workaround: plus the MutablePage /64 workaround for
        # https://issues.chromium.org/issues/574828088, which is unrelated to
        # Highway but stops the GCC riscv64 build.
        variant: [pr-head, mutable-page-workaround]
    container:
      image: aosc/aosc-os@sha256:2363d4f69429294993aea01afa4cd57d8806235eb004fd53fa82cc36997520eb
    defaults:
      run:
        shell: bash
    env:
      VARIANT: ${{ matrix.variant }}
      CC: ccache riscv64-linux-gnu-gcc
      CXX: ccache riscv64-linux-gnu-g++
      CC_host: ccache clang
      CXX_host: ccache clang++
      AR: riscv64-linux-gnu-ar
      AR_host: ar
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_HOME: /opt/validation-cargo
      RUSTUP_HOME: /opt/validation-rustup
      CCACHE_MAXSIZE: 1G
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install compilers and runtime dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y git curl make pkg-config ccache python-3 flex qemu-riscv64-static \
            'gcc+cross-riscv64=15.3.0+glibc2.42+5-1' 'llvm-22=22.1.8-2'
          echo '/usr/lib/llvm-22/bin' >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.1 --no-modify-path
          /opt/validation-cargo/bin/rustup target add riscv64gc-unknown-linux-gnu
          echo '/opt/validation-cargo/bin' >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned PR head
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin 2aaf14aeddb1995a2dbc304b3dd03cb8b6d87e80
      - name: Verify toolchain, sysroot, ar and QEMU
        run: |
          mkdir -p audit-temporal
          { cat /etc/os-release; uname -a; nproc; free -h; df -h; } > audit-temporal/resources.log
          python3 tools/validation-riscv-v8-158/prepare.py toolchain
      - name: Check sources and configure with Temporal
        run: python3 tools/validation-riscv-v8-158/prepare.py prepare
      - name: Full Make build and staged install
        timeout-minutes: 330
        run: |
          set -euo pipefail
          test -z "${CARGO_BUILD_TARGET:-}"
          task_audit="$GITHUB_WORKSPACE/audit-temporal"
          cd "$(cat "$task_audit/source-path.txt")"
          trap 'task_exit=$?; echo "$task_exit" > "$task_audit/build-exit-code"' EXIT
          # -k: keep compiling after an error so every Highway user is attempted.
          make CC="$CC" CXX="$CXX" CC_host="$CC_host" CXX_host="$CXX_host" \
            DESTDIR="$PWD/target" V=1 -k install -j4 2>&1 | tee "$task_audit/build.log"
      - name: Preserve generated Node and runtime libraries
        if: always()
        run: python3 tools/validation-riscv-v8-158/prepare.py save_binary
      - name: Audit install and host/target Rust archives
        if: always()
        run: python3 tools/validation-riscv-v8-158/prepare.py diagnostics
      - name: Run installed Node with non-RVV QEMU
        timeout-minutes: 10
        run: python3 tools/validation-riscv-v8-158/prepare.py smoke
      - name: Summarize
        if: always()
        run: python3 tools/validation-riscv-v8-158/prepare.py summary
      - name: Record final resources
        if: always()
        run: |
          mkdir -p audit-temporal
          { free -h; df -h; ccache -s; } > audit-temporal/final-resources.log
          dmesg | tail -100 > audit-temporal/dmesg-tail.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: riscv-v8-158-${{ matrix.variant }}
          path: audit-temporal/
          retention-days: 7
