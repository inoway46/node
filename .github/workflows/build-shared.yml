name: Build Node.js (shared libraries)

on:
  workflow_call:
    inputs:
      runner:
        description: The runner to use for the job.
        required: true
        type: string
      extra-nix-flags:
        description: Additional CLI arguments appended to the nix-shell invocation.
        required: false
        type: string
        default: ''
      with-sccache:
        description: Whether to enable sccache
        required: false
        type: boolean
        default: false
      v8-nar:
        description: An optional name for the NAR archive for V8 that needs to be downloaded
        required: false
        type: string
        default: ''
      pkcs11-store-test:
        description: Whether to enable the PKCS#11-backed crypto STORE test
        required: false
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix auth token for nodejs.cachix.org.
        required: false

permissions: {}

env:
  FLAKY_TESTS: keep_retrying

jobs:
  build:
    timeout-minutes: 360
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: tarballs
          pattern: '*.tar.gz'
          merge-multiple: true

      - name: Extract tarball
        shell: bash
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        with:
          extra_nix_config: sandbox = true

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: nodejs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check whether Cachix has the macOS V8 build
        id: v8
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        env:
          HAS_CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN && 'true' }}
        run: |
          # Jobs with write access can already share their builds through Cachix.
          if [ "$HAS_CACHIX_AUTH_TOKEN" = true ]; then exit 0; fi
          drv=$(nix-instantiate "$TAR_DIR/tools/nix/ci-shell.nix" -A v8Derivation)
          out=$(nix-store --query --outputs "$drv")
          name=${out##*/}
          if ! curl -fsSI -o /dev/null "https://nodejs.cachix.org/${name%%-*}.narinfo"; then
            echo "drv=$drv" >> "$GITHUB_OUTPUT"
            echo "key=test-shared-v8-$RUNNER_ARCH-$name" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: restore-v8
        if: steps.v8.outputs.key
        with:
          path: libv8-macos.nar
          key: ${{ steps.v8.outputs.key }}

      - name: Import cached V8
        if: steps.restore-v8.outputs.cache-hit == 'true'
        run: |
          nix-store --import < libv8-macos.nar || echo "::warning::Could not import V8. Nix will build it if needed."

      - name: Build V8 for this pull request
        if: steps.v8.outputs.key && steps.restore-v8.outputs.cache-hit != 'true'
        env:
          V8_DRV: ${{ steps.v8.outputs.drv }}
        run: |
          out=$(nix-build --no-out-link "$V8_DRV")
          nix-store --export "$out" > libv8-macos.nar

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.v8.outputs.key && steps.restore-v8.outputs.cache-hit != 'true'
        with:
          path: libv8-macos.nar
          key: ${{ steps.v8.outputs.key }}

      - name: Verify PR cache behavior
        env:
          CACHE_KEY: ${{ steps.v8.outputs.key }}
          CACHE_HIT: ${{ steps.restore-v8.outputs.cache-hit }}
          DRV: ${{ steps.v8.outputs.drv }}
        shell: bash
        run: |
          test -n "$CACHE_KEY"
          out=$(nix-store --query --outputs "$DRV")
          hash=$(nix-store --query --hash "$out")
          expected=miss
          if grep -q "v8-nar-warm-$RUNNER_ARCH" "$TAR_DIR/lib/assert.js" &&
             ! grep -q "v8-nar-invalidated-$RUNNER_ARCH" "$TAR_DIR/deps/v8/src/base/bits.cc"; then
            expected=hit
          fi
          actual=miss
          if [[ "$CACHE_HIT" == true ]]; then actual=hit; fi
          printf '| Expected | Observed | V8 output | NAR hash |\n|---|---|---|---|\n| %s | %s | `%s` | `%s` |\n' \
            "$expected" "$actual" "$out" "$hash" >> "$GITHUB_STEP_SUMMARY"
          test "$expected" = "$actual"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: inputs.v8-nar
        with:
          name: ${{ inputs.v8-nar }}

      - name: Configure sccache
        if: inputs.with-sccache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('NIX_SCCACHE', '(import <nixpkgs> {}).sccache');

      - name: Build Node.js and run tests
        shell: bash
        run: |
          nix-shell \
            -I "nixpkgs=$TAR_DIR/tools/nix/pkgs.nix" \
            --pure --keep TAR_DIR --keep FLAKY_TESTS \
            --keep SCCACHE_GHA_ENABLED --keep ACTIONS_CACHE_SERVICE_V2 --keep ACTIONS_RESULTS_URL --keep ACTIONS_RUNTIME_TOKEN \
            --arg ccache "${NIX_SCCACHE:-null}" \
            --arg pkcs11 ${{ inputs.pkcs11-store-test }} \
            ${{ inputs.extra-nix-flags }} \
            --run '
                make -C "$TAR_DIR" run-ci -j4 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9 --skip-tests=$CI_SKIP_TESTS"
            ' "$TAR_DIR/tools/nix/ci-shell.nix"
