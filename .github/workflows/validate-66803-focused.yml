name: Validate 66804 shared generators and consumer objects
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        generator: [make, ninja]
        cpu: [x64, riscv64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch exact PR head
        run: git fetch --depth=1 origin 55f21fa99021d3f4aed7e6472210e220a615bf5c
      - name: Install compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu
      - name: Generate shared files and compile representative consumers
        timeout-minutes: 35
        env:
          GENERATOR: ${{ matrix.generator }}
          CPU: ${{ matrix.cpu }}
        run: python3 tools/validation-66803/focused.py "$GENERATOR" "$CPU"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: focused-${{ matrix.generator }}-${{ matrix.cpu }}
          path: focused-results/
