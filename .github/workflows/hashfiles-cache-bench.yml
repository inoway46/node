# Fork-only experiment; not for upstream.
name: HashFiles cache benchmark
on:
  push:
    branches: [codex/hashfiles-cache-bench]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        replica: [1, 2, 3, 4]
    env:
      BENCH_OUT: /tmp/hashfiles-results
      HASH_SCRIPT: /tmp/hashFiles.js
      REPEATS: '10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Fetch pinned official hashFiles implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/actions/runner/contents/src/Misc/layoutbin/hashFiles/index.js?ref=5ba50443372004d4d67620909426c5d28a0066af' --jq .content | base64 --decode > "$HASH_SCRIPT"
          node --version
          git rev-parse HEAD
      - name: Before installation
        run: python3 .github/hashfiles-probe/bench.py pre
      - name: Observe before main and post
        uses: ./.github/hashfiles-probe
        env:
          VARIANT: before
          HASH: ${{ hashFiles('eslint.config.mjs', '*/eslint.config_partial.mjs', 'tools/eslint/*', 'tools/eslint-rules/**', 'doc/api/errors.md', 'doc/api/deprecations.md') }}
      - name: Observe after main and post
        uses: ./.github/hashfiles-probe
        env:
          VARIANT: after
          HASH: ${{ hashFiles('eslint.config.mjs', '*/eslint.config_partial.mjs', 'tools/eslint/*', 'tools/eslint-rules/**', 'doc/api/errors.md', 'doc/api/deprecations.md', '!**/node_modules/**') }}
      - name: Install the same three lint dependency trees
        run: |
          for dir in tools/eslint tools/lint-md tools/doc; do
            (cd "$dir" && node "$GITHUB_WORKSPACE/deps/npm/bin/npm-cli.js" ci --omit=dev)
          done
      - name: After installation
        run: python3 .github/hashfiles-probe/bench.py post
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hashfiles-${{ matrix.replica }}
          path: /tmp/hashfiles-results
          retention-days: 7
