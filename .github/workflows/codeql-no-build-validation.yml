# Fork-only throwaway workflow. Not for upstream; do not include in any PR.
# Mirrors .github/workflows/codeql.yml on this branch (build-mode: none on
# ubuntu-latest) without uploading results to code scanning.
name: CodeQL no-build validation

on:
  push:
    branches: [ci/codeql-no-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'inoway46/node'
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [cpp, javascript, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:${{matrix.language}}
          output: codeql-results
          upload: never
          upload-database: false

      - name: Summarize results
        if: always()
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          {
            echo "### CodeQL ${LANGUAGE} (build-mode: none)"
            echo
            echo "| SARIF | results | rules with results |"
            echo "| --- | --- | --- |"
            for f in codeql-results/*.sarif; do
              [ -e "$f" ] || continue
              results=$(jq '[.runs[].results[]] | length' "$f")
              rules=$(jq '[.runs[].results[].ruleId] | unique | length' "$f")
              echo "| $(basename "$f") | ${results} | ${rules} |"
              echo "RESULT ${LANGUAGE} results=${results} rules=${rules}" >&2
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-no-build-results-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: 7
