# Fork-only experiment; not part of the upstream runner-change PR.
name: Benchmark tarball gzip 1-6 - 10 per level

on:
  push:
    branches: [codex/benchmark-gzip1-6-10]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: lts/*
  DISTTYPE: nightly
  DATESTRING: '2026-09-23'
  SOURCE_SHA: 2c2aafe04d80935fd7d9c6e73fb7fdcf52b4d268

jobs:
  build-tarball:
    name: gzip-${{ matrix.level }} / sample-${{ matrix.n }}
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {level: 1, n: 0}
          - {level: 2, n: 0}
          - {level: 3, n: 0}
          - {level: 4, n: 0}
          - {level: 5, n: 0}
          - {level: 6, n: 0}
          - {level: 2, n: 1}
          - {level: 3, n: 1}
          - {level: 4, n: 1}
          - {level: 5, n: 1}
          - {level: 6, n: 1}
          - {level: 1, n: 1}
          - {level: 3, n: 2}
          - {level: 4, n: 2}
          - {level: 5, n: 2}
          - {level: 6, n: 2}
          - {level: 1, n: 2}
          - {level: 2, n: 2}
          - {level: 4, n: 3}
          - {level: 5, n: 3}
          - {level: 6, n: 3}
          - {level: 1, n: 3}
          - {level: 2, n: 3}
          - {level: 3, n: 3}
          - {level: 5, n: 4}
          - {level: 6, n: 4}
          - {level: 1, n: 4}
          - {level: 2, n: 4}
          - {level: 3, n: 4}
          - {level: 4, n: 4}
          - {level: 6, n: 5}
          - {level: 1, n: 5}
          - {level: 2, n: 5}
          - {level: 3, n: 5}
          - {level: 4, n: 5}
          - {level: 5, n: 5}
          - {level: 1, n: 6}
          - {level: 2, n: 6}
          - {level: 3, n: 6}
          - {level: 4, n: 6}
          - {level: 5, n: 6}
          - {level: 6, n: 6}
          - {level: 2, n: 7}
          - {level: 3, n: 7}
          - {level: 4, n: 7}
          - {level: 5, n: 7}
          - {level: 6, n: 7}
          - {level: 1, n: 7}
          - {level: 3, n: 8}
          - {level: 4, n: 8}
          - {level: 5, n: 8}
          - {level: 6, n: 8}
          - {level: 1, n: 8}
          - {level: 2, n: 8}
          - {level: 4, n: 9}
          - {level: 5, n: 9}
          - {level: 6, n: 9}
          - {level: 1, n: 9}
          - {level: 2, n: 9}
          - {level: 3, n: 9}
    env:
      BATCH: 1
      LEVEL: ${{ matrix.level }}
      SAMPLE: ${{ matrix.n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Make tarball
        run: |
          echo "BENCHMARK_LEVEL=$LEVEL BENCHMARK_BATCH=$BATCH BENCHMARK_SAMPLE=$SAMPLE SOURCE_SHA=$SOURCE_SHA"
          /usr/bin/gzip --version
          export COMMIT=$(git rev-parse --short=10 "$SOURCE_SHA")
          mkdir -p "$RUNNER_TEMP/timed-bin"
          cat > "$RUNNER_TEMP/timed-bin/gzip" <<'SCRIPT'
          #!/bin/sh
          /usr/bin/time -f 'GZIP_SECONDS=%e GZIP_USER_SECONDS=%U GZIP_SYSTEM_SECONDS=%S' -o "$RUNNER_TEMP/gzip.time" /usr/bin/gzip "$@"
          status=$?
          cat "$RUNNER_TEMP/gzip.time" >&2
          exit "$status"
          SCRIPT
          chmod +x "$RUNNER_TEMP/timed-bin/gzip"
          export PATH="$RUNNER_TEMP/timed-bin:$PATH"
          /usr/bin/time -f 'CONFIGURE_SECONDS=%e' -o "$RUNNER_TEMP/configure.time" ./configure
          /usr/bin/time -f 'MAKE_TAR_SECONDS=%e' -o "$RUNNER_TEMP/make.time" make tar -j4 SKIP_XZ=1 GZIP_COMPRESSION="$LEVEL"
          stat --format='TARBALL_BYTES=%s' ./*.tar.gz | tee "$RUNNER_TEMP/size.txt"
          # archive:false uses the filename as the actual artifact name.
          mkdir -p benchmark-artifact
          printf -v artifact_name 'gzip-%s-batch-%s-sample-%02d.tar.gz' "$LEVEL" "$BATCH" "$SAMPLE"
          mv ./*.tar.gz "benchmark-artifact/$artifact_name"
      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: benchmark-artifact/*.tar.gz
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Record available measurements
        if: always()
        run: |
          {
            echo "Level: $LEVEL; batch: $BATCH; sample: $SAMPLE; source: $SOURCE_SHA"
            echo '```text'
            for metric in configure.time gzip.time make.time size.txt; do
              if [ -f "$RUNNER_TEMP/$metric" ]; then
                cat "$RUNNER_TEMP/$metric"
              fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
