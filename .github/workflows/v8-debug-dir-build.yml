# Fork-only experiment; not for upstream.
name: Build V8 with a normalized DWARF compilation directory

on:
  workflow_call:
    inputs:
      warm:
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      CACHE_DIR: /nix/var/cache/v8-debug-dir
      PHASE: ${{ inputs.warm && 'warm' || 'cold' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github/ci-v8-debug-dir

      - name: Locate the successful checkpoint run
        id: checkpoint
        if: inputs.warm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent=$(git rev-parse HEAD^)
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --branch ci/v8-ccache-checkpoint --commit "$parent" --workflow v8-debug-dir.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ steps.checkpoint.outputs.id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: '*.tar.gz'
          path: tarballs
          merge-multiple: true

      - name: Extract shared CI tarball
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        with:
          extra_nix_config: |
            sandbox = true
            extra-sandbox-paths = ${{ env.CACHE_DIR }}

      - name: Prepare sandbox cache
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0777 "$CACHE_DIR"

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: nodejs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: inputs.warm
        with:
          run-id: ${{ steps.checkpoint.outputs.id }}
          github-token: ${{ github.token }}
          name: v8-debug-dir-cold
          path: reference

      - name: Restore the partial compiler cache
        if: inputs.warm
        run: |
          zstd -dc reference/cache.tar.zst | tar xf - -C "$CACHE_DIR"
          sudo chmod -R a+rwX "$CACHE_DIR"

      - name: Check DWARF and measure the V8 build
        run: bash .github/ci-v8-debug-dir/measure.sh

      - name: Compress compiler cache
        if: ${{ !inputs.warm }}
        run: |
          mkdir -p reference
          sudo chmod -R a+rX "$CACHE_DIR"
          tar cf - -C "$CACHE_DIR" . | zstd -T0 -1 -o reference/cache.tar.zst
          echo "Compressed compiler cache: $(wc -c < reference/cache.tar.zst) bytes" >> "$GITHUB_STEP_SUMMARY"
          cp stats.txt reference/cold-stats.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !inputs.warm }}
        with:
          name: v8-debug-dir-cold
          path: reference/
          overwrite: true
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: v8-debug-dir-${{ env.PHASE }}-measurements
          path: |
            live-stats.txt
            libraries.txt
            stats.txt
            build.log
            dwarf.txt
          overwrite: true
          retention-days: 7
