# Fork-only throwaway workflow (inoway46/node); not for upstream.
#
# Prototype of "option 1": skip the darwin shared-library jobs when the V8
# derivation is not in nodejs.cachix.org and there is no CACHIX_AUTH_TOKEN to
# push it (the fork-PR situation). A trimmed copy of test-shared.yml: only the
# tarball, the new cache check, and the darwin entries of the `build` matrix.
name: CI V8 skip-on-miss prototype

on:
  push:
    branches:
      - ci/v8-skip-hit
      - ci/v8-skip-miss
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tarball:
    name: Build slim tarball
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Make tarball
        run: |
          export DATESTRING=$(date "+%Y-%m-%d")
          export COMMIT=$(git rev-parse --short=10 "$GITHUB_SHA")
          ./configure && make tar -j4 SKIP_XZ=1 SKIP_SHARED_DEPS=1 GZIP_COMPRESSION=6
        env:
          DISTTYPE: nightly

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: '*.tar.gz'
          archive: false

  # New job: evaluates the darwin V8 derivations on a cheap Linux runner and
  # decides, per system, whether the darwin job would have to build V8 from
  # source without being able to push the result.
  check-v8-cache:
    needs: build-tarball
    name: Check V8 cache status for darwin
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      HAS_CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN && 'true' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: tarballs

      - name: Extract tarball
        shell: bash
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        with:
          extra_nix_config: sandbox = true

      - name: Evaluate darwin V8 derivations, check their cache status
        id: check
        run: |
          skip='{}'
          for system in x86_64-darwin aarch64-darwin; do
            V8_DRV=$(
              nix-instantiate --option system "$system" \
                -E "(import $TAR_DIR/tools/nix/ci-shell.nix {}).v8Derivation"
            )
            V8_STORE_PATH=$(nix-store -q --outputs "$V8_DRV")
            status=$(curl -ISsw "%{http_code}" -o /dev/null "https://nodejs.cachix.org/$(basename "${V8_STORE_PATH%-v8-*}").narinfo")
            echo "RESULT $system v8=$V8_STORE_PATH narinfo=$status"
            if [ "$status" != "200" ] && [ "$HAS_CACHIX_AUTH_TOKEN" != "true" ]; then
              echo "::notice title=$system shared-library job skipped::V8 ($V8_STORE_PATH) is not in nodejs.cachix.org and this run cannot push to it, so the job would build V8 from source (3-5 hours)."
              skip=$(jq -c --arg s "$system" '.[$s] = true' <<<"$skip")
            fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "RESULT skip=$skip"

  build:
    needs: [build-tarball, check-v8-cache]
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-linux entry of test-shared.yml omitted in this prototype.
          - runner: macos-15-intel
            system: x86_64-darwin
          - runner: macos-latest
            system: aarch64-darwin
    name: '${{ matrix.system }}: with shared libraries'
    uses: $/.github/workflows/build-shared.yml
    with:
      runner: ${{ matrix.runner }}
      with-sccache: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
      skip: ${{ fromJSON(needs.check-v8-cache.outputs.skip)[matrix.system] == true }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
