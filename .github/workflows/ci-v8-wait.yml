# Fork-only throwaway workflow (inoway46/node); not for upstream.
#
# Prototype of "wait for the binary cache instead of rebuilding V8".
# When the V8 a darwin shared-library job needs is not in nodejs.cachix.org,
# and the change under test is not what invalidated it, the base branch's
# push run is already building that same V8. A cheap Linux job waits for it
# to show up instead of starting a second multi-hour build on macOS.
#
# No macOS runner is used here: only the gate is exercised. Each scenario
# fakes its situation by editing configure.py (a V8 build input) in the
# trees before evaluating them:
#   hit                untouched trees               -> cached
#   culprit            head changes a V8 input       -> build-own-change
#   bystander          base changed a V8 input       -> build-after-timeout
#   bystander-appears  same, V8 shows up in a local  -> cached-after-wait
#                      fake cache after 60s
name: CI V8 wait-for-cache prototype

on:
  push:
    branches:
      - ci/v8-wait
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tarball:
    name: Build slim tarball
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Make tarball
        run: |
          export DATESTRING=$(date "+%Y-%m-%d")
          export COMMIT=$(git rev-parse --short=10 "$GITHUB_SHA")
          ./configure && make tar -j4 SKIP_XZ=1 SKIP_SHARED_DEPS=1 GZIP_COMPRESSION=6
        env:
          DISTTYPE: nightly

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: '*.tar.gz'
          archive: false

  gate:
    needs: build-tarball
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-darwin, aarch64-darwin]
        scenario: [hit, culprit, bystander, bystander-appears]
    name: '${{ matrix.system }}: ${{ matrix.scenario }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SYSTEM: ${{ matrix.system }}
      SCENARIO: ${{ matrix.scenario }}
    steps:
      # Head: the commit under test. In a pull_request run this would be the
      # merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          path: head

      # Base: in a pull_request run this would be
      # github.event.pull_request.base.sha. Here it is the parent commit,
      # i.e. the upstream commit this branch was cut from.
      - name: Resolve base commit
        id: base
        run: echo "sha=$(git -C head rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: tarballs

      - name: Extract tarball
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3

      - name: Fake the scenario
        run: |
          change() {
            printf '\n# ci/v8-wait: simulated change to a V8 build input.\n' >> "$1/configure.py"
          }
          case "$SCENARIO" in
            hit) ;;
            culprit) change "$TAR_DIR"; change head ;;
            bystander*) change "$TAR_DIR"; change head; change base ;;
          esac
          # Same edit `make tar` applies, so the checkouts evaluate without git.
          for tree in head base; do
            sed -i 's/fileset = fileset.intersection (fileset.gitTracked root)/fileset =/' \
              "$tree/tools/nix/v8.nix"
          done

      - name: Evaluate V8 derivations
        id: v8
        run: |
          eval_v8() {
            local drv
            drv=$(
              nix-instantiate --option system "$SYSTEM" \
                -E "(import $1/tools/nix/ci-shell.nix {}).v8Derivation"
            )
            nix-store -q --outputs "$drv"
          }
          {
            echo "tarball=$(eval_v8 "$TAR_DIR")"
            echo "head=$(eval_v8 "$GITHUB_WORKSPACE/head")"
            echo "base=$(eval_v8 "$GITHUB_WORKSPACE/base")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Wait for V8 if someone else is building it
        id: gate
        env:
          V8_PATH: ${{ steps.v8.outputs.tarball }}
          HEAD_PATH: ${{ steps.v8.outputs.head }}
          BASE_PATH: ${{ steps.v8.outputs.base }}
          CAN_PUSH: ${{ secrets.CACHIX_AUTH_TOKEN && 'true' || 'false' }}
          INTERVAL: 15
        run: |
          export CACHE_URL=https://nodejs.cachix.org
          export MAX_WAIT=90
          if [ "$SCENARIO" = bystander-appears ]; then
            # Local stand-in for the binary cache: the narinfo appears after
            # 60s, as if the base branch's run had just pushed V8.
            fake="$RUNNER_TEMP/fake-cache"
            mkdir -p "$fake"
            python3 -m http.server 8099 --bind 127.0.0.1 --directory "$fake" > /dev/null 2>&1 &
            (sleep 60; touch "$fake/$(basename "${V8_PATH%-v8-*}").narinfo") &
            sleep 2
            export CACHE_URL=http://127.0.0.1:8099
            export MAX_WAIT=240
          fi
          bash head/.github/ci-v8-wait/gate.sh

      - name: Report
        if: always()
        env:
          TARBALL_PATH: ${{ steps.v8.outputs.tarball }}
          HEAD_PATH: ${{ steps.v8.outputs.head }}
          BASE_PATH: ${{ steps.v8.outputs.base }}
          DECISION: ${{ steps.gate.outputs.decision }}
          WAITED: ${{ steps.gate.outputs.waited }}
        run: |
          case "$SCENARIO" in
            hit) expected=cached ;;
            culprit) expected=build-own-change ;;
            bystander) expected=build-after-timeout ;;
            bystander-appears) expected=cached-after-wait ;;
          esac
          same_as_tarball=no
          [ -n "$TARBALL_PATH" ] && [ "$TARBALL_PATH" = "$HEAD_PATH" ] && same_as_tarball=yes
          head_is_base=no
          [ -n "$HEAD_PATH" ] && [ "$HEAD_PATH" = "$BASE_PATH" ] && head_is_base=yes
          echo "RESULT system=$SYSTEM scenario=$SCENARIO decision=$DECISION expected=$expected waited=${WAITED}s checkout==tarball=$same_as_tarball head==base=$head_is_base v8=$TARBALL_PATH"
          {
            echo "| system | scenario | decision | expected | waited | checkout == tarball | head == base |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            echo "| $SYSTEM | $SCENARIO | $DECISION | $expected | ${WAITED}s | $same_as_tarball | $head_is_base |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$DECISION" = "$expected" ]
