name: Issue 66457 arm64 reproduction

on:
  push:
    branches: [codex/repro-66457-arm64]
    paths:
      - .github/workflows/repro-66457-arm64.yml
      - .github/diagnostics/issue-66457/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'inoway46/node'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        node: [26.10.0, 26.9.0, 24.11.0, 22.23.1]
    env:
      NODE_VERSION: ${{ matrix.node }}
      EXPECT_ARCH: arm64
      REPRO_RUNS: '3000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download official arm64 binary (no build)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p results
          archive="node-v${NODE_VERSION}-darwin-arm64.tar.gz"
          base="https://nodejs.org/dist/v${NODE_VERSION}"
          curl --fail --location --retry 3 "$base/SHASUMS256.txt" -o results/SHASUMS256.txt
          curl --fail --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          awk -v name="$archive" '$2 == name { print }' results/SHASUMS256.txt > results/archive.sha256
          test -s results/archive.sha256
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$GITHUB_WORKSPACE/results/archive.sha256")
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "node-v${NODE_VERSION}-darwin-arm64/bin/node"
          echo "NODE_BINARY=$RUNNER_TEMP/node-v${NODE_VERSION}-darwin-arm64/bin/node" >> "$GITHUB_ENV"
      - name: Run unchanged reproducer and collect traces
        shell: python
        run: |
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import time

          root = Path.cwd()
          output = root / 'results'
          output.mkdir(exist_ok=True)
          node = str(Path(os.environ['NODE_BINARY']).resolve())
          env = os.environ.copy()
          env.pop('NODE_OPTIONS', None)
          source = root / '.github/diagnostics/issue-66457/reproducer.txt'
          code = source.read_bytes()
          expected = '94ce50a5eb81b4f121eb67937f5a81da19f551c36f9b7561b2fa7d89f7cbfd84'
          assert hashlib.sha256(code).hexdigest() == expected
          reproducer = output / 'maglev-osr-alias.mjs'
          reproducer.write_bytes(code)
          metadata = json.loads(subprocess.check_output([
              node, '-p', 'JSON.stringify({version:process.version,v8:process.versions.v8,'
              'arch:process.arch,platform:process.platform,cpus:require("os").cpus()})'
          ], env=env, text=True))
          assert metadata['arch'] == os.environ.get('EXPECT_ARCH', 'arm64'), metadata
          assert metadata['version'] == 'v' + os.environ['NODE_VERSION'], metadata
          metadata.update(os=platform.platform(),parallelism=8,reproducer_sha256=expected,
                          run_id=os.environ.get('GITHUB_RUN_ID'),
                          commit=os.environ.get('GITHUB_SHA'))
          if platform.system() == 'Darwin':
              metadata['sysctl'] = subprocess.check_output([
                  'sysctl', 'hw.logicalcpu', 'hw.physicalcpu', 'hw.memsize',
                  'machdep.cpu.brand_string'], text=True)
              metadata['sw_vers'] = subprocess.check_output(['sw_vers'], text=True)
          (output / 'environment.json').write_text(json.dumps(metadata, indent=2) + '\n')
          options = subprocess.check_output([node, '--v8-options'], env=env, text=True)
          (output / 'v8-options.txt').write_text(options)
          limit = int(os.environ.get('REPRO_RUNS', '3000'))
          summary = {'environment': metadata, 'conditions': {}}

          def run_batch(name, flags, count):
              directory = output / name
              directory.mkdir(exist_ok=True)
              command = [node, *flags, str(reproducer)]
              (directory / 'command.json').write_text(json.dumps(command))
              def run(index):
                  started = time.monotonic()
                  try:
                      result = subprocess.run(command, env=env, capture_output=True,
                                              timeout=120)
                      stdout, stderr, rc = result.stdout, result.stderr, result.returncode
                  except subprocess.TimeoutExpired as error:
                      stdout, stderr, rc = error.stdout or b'', error.stderr or b'', 'timeout'
                  (directory / f'{index:04d}.stdout').write_bytes(stdout)
                  (directory / f'{index:04d}.stderr').write_bytes(stderr)
                  text = stdout.decode(errors='replace')
                  bug = 'BUG: results of earlier calls changed after later calls' in text
                  ok = rc == 0 and text.rstrip().endswith('ok')
                  return {'run': index, 'returncode': rc, 'bug': bug, 'ok': ok,
                          'error': not ok and not (rc == 1 and bug),
                          'seconds': round(time.monotonic() - started, 3)}
              rows = []
              with (directory / 'runs.jsonl').open('w') as record:
                  with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                      for row in pool.map(run, range(1, count + 1)):
                          rows.append(row)
                          record.write(json.dumps(row) + '\n')
                          record.flush()
                          if len(rows) % 100 == 0:
                              print(name, len(rows), 'bugs', sum(r['bug'] for r in rows),
                                    'errors', sum(r['error'] for r in rows), flush=True)
              result = {'runs': len(rows), 'failures': sum(r['bug'] for r in rows),
                        'errors': sum(r['error'] for r in rows),
                        'ok': sum(r['ok'] for r in rows), 'flags': flags}
              summary['conditions'][name] = result
              (output / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
              return result

          for name, flags in [('normal', []), ('no-maglev-osr', ['--no-maglev-osr']),
                              ('no-concurrent-osr', ['--no-concurrent-osr'])]:
              if flags and not re.search(r'^  --' + name[3:] + r'\s', options, re.M):
                  summary['conditions'][name] = {'skipped': 'flag unavailable', 'runs': 0}
                  continue
              run_batch(name, flags, limit)

          has_bug = any(r.get('failures', 0) for r in summary['conditions'].values())
          trace_count = int(os.environ.get('TRACE_RUNS', '600' if has_bug else '100'))
          run_batch('trace', ['--trace-opt', '--trace-deopt'], trace_count)
          trace_rows = []
          for path in sorted((output / 'trace').glob('*.stdout')):
              text = path.read_text(errors='replace')
              lines = text.splitlines()
              deopts = [line for line in lines if 'bailout' in line and 'faceStats' in line
                        and 'Insufficient type feedback for generic named access' in line]
              maglev = [line for line in deopts if '<Code MAGLEV>' in line]
              trace_rows.append({
                  'file': path.name, 'bug': 'BUG:' in text,
                  'changed_objects': sum(line.startswith('call ') for line in lines),
                  'maglev_osr_compiled': any('completed compiling' in line
                                            and 'faceStats' in line
                                            and '(target MAGLEV) OSR' in line for line in lines),
                  'named_deopts': deopts, 'maglev_named_deopt_count': len(maglev),
              })
          (output / 'trace-analysis.json').write_text(json.dumps(trace_rows, indent=2) + '\n')
          with (output / 'faceStats-bytecode.log').open('wb') as log:
              result = subprocess.run([node, '--print-bytecode', '--print-bytecode-filter=faceStats',
                                       str(reproducer)], env=env, stdout=log,
                                      stderr=subprocess.STDOUT, timeout=120)
          summary['bytecode_inspection_returncode'] = result.returncode
          summary['trace'] = {
              'runs_with_maglev_osr': sum(r['maglev_osr_compiled'] for r in trace_rows),
              'runs_with_maglev_named_deopt': sum(r['maglev_named_deopt_count'] > 0 for r in trace_rows),
              'failing_runs_with_maglev_named_deopt': sum(r['bug'] and r['maglev_named_deopt_count'] > 0
                                                        for r in trace_rows),
          }
          (output / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2), flush=True)
          if 'GITHUB_STEP_SUMMARY' in os.environ:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
                  report.write(f"Node {metadata['version']} / V8 {metadata['v8']} / "
                               f"{metadata['os']} / {len(metadata['cpus'])} logical CPUs / 8 processes\n\n")
                  report.write('| Condition | Runs | BUG | Harness/runtime errors |\n|---|---:|---:|---:|\n')
                  for name, row in summary['conditions'].items():
                      report.write(f"| {name} | {row['runs']} | {row.get('failures', 'N/A')} | "
                                   f"{row.get('errors', row.get('skipped', 0))} |\n")
                  report.write('\nBUG observations are diagnostic results; infrastructure errors fail the job.\n')
          if any(row.get('errors', 0) or row.get('skipped') for row in summary['conditions'].values()):
              raise SystemExit('Incomplete verification: runtime errors or unsupported flags')
      - name: Upload raw logs and summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: issue-66457-macos-arm64-node-${{ matrix.node }}
          path: results/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
