name: Reproduce issue 66349

on:
  workflow_dispatch:
  push:
    branches: [codex/repro-66349]
    paths: [.github/workflows/repro-66349.yml]

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'inoway46/node'
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [26.9.0, 26.10.0]
    steps:
      - name: Install released binary (no build)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run exact issue reproducer and check reported behavior
        shell: bash
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { spawnSync } = require('node:child_process');
          const { appendFileSync, writeFileSync } = require('node:fs');
          const source = "require('node:stream').Duplex.from(async () => {})";
          const result = spawnSync(process.execPath, ['-e', source], {
            encoding: 'utf8',
            timeout: 30000,
          });
          const metadata = {
            version: process.version,
            platform: process.platform,
            arch: process.arch,
            executable: process.execPath,
            revision: process.env.GITHUB_SHA,
            source,
            status: result.status,
            signal: result.signal,
            error: result.error?.message,
          };
          writeFileSync('result.json', JSON.stringify(metadata, null, 2));
          writeFileSync('stdout.log', result.stdout || '');
          writeFileSync('stderr.log', result.stderr || '');
          console.log(metadata);
          process.stdout.write(result.stdout || '');
          process.stderr.write(result.stderr || '');
          assert.equal(process.version, `v${process.env.EXPECTED_NODE}`);
          assert.ifError(result.error);
          assert.equal(result.signal, null);
          assert.equal(result.stdout, '');
          const affected = process.env.EXPECTED_NODE === '26.10.0';
          if (affected) {
            assert.equal(result.status, 1);
            assert.match(result.stderr, /Unhandled 'error' event/);
            assert.match(result.stderr, /AbortError: The operation was aborted/);
            assert.match(result.stderr, /code: 'ABORT_ERR'/);
          } else {
            assert.equal(result.status, 0);
            assert.equal(result.stderr, '');
          }
          const verdict = affected ? 'REPRODUCED: unhandled ABORT_ERR (exit 1)' :
            'BASELINE: clean exit with no output (exit 0)';
          console.log(verdict);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                         `### ${process.version} / ${process.platform} / ${process.arch}\n\n${verdict}\n`);
          NODE
      - name: Preserve raw result and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: repro-66349-${{ matrix.os }}-${{ matrix.node }}
          path: |
            result.json
            stdout.log
            stderr.log
          if-no-files-found: warn
          retention-days: 14
