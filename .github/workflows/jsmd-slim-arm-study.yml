name: JS/MD slim and ARM cache comparison
on:
  push:
    branches: [jsmd-slim-arm-cache-benchmark]
    paths: [.github/workflows/jsmd-slim-arm-study.yml]
permissions:
  contents: read
env:
  NODE_VERSION: 24.22.1
  SOURCE_SHA: 763524d434aa6b40fecbaf088b0fa788b3aa0375
jobs:
  seed:
    if: github.repository == 'inoway46/node'
    name: seed / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-26.04-arm}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 1eb734d568c9db7278c37a37e89d44a3356cdb63
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Lint JavaScript files
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/js-time.txt" env NODE="$(command -v node)" make lint-js ESLINT_CACHE_FLAGS="--cache --cache-strategy content --format json --output-file $RUNNER_TEMP/diagnostics.json"
      - name: Get release version numbers
        id: versions
        run: ./tools/lint-md/list-released-versions-from-changelogs.mjs >> "$GITHUB_OUTPUT"
      - name: Lint Markdown and verify man page
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/md-time.txt" env NODE="$(command -v node)" make lint-md ESLINT_CACHE_FLAGS="--cache --cache-strategy content --format json --output-file $RUNNER_TEMP/doc-diagnostics.json"
          test -f tools/doc/.manpagecheck/node.1
          sha256sum tools/doc/.manpagecheck/node.1 > "$RUNNER_TEMP/manpage.sha256"
        env:
          NODE_RELEASED_VERSIONS: ${{ steps.versions.outputs.NODE_RELEASED_VERSIONS }}
      - name: Save npm seed
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: arm-study-npm-${{ github.run_id }}-${{ matrix.arch }}
      - name: Save ESLint seed
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .eslintcache
          key: arm-study-eslint-${{ github.run_id }}-${{ matrix.arch }}-parent
  smoke:
    needs: seed
    name: ${{ matrix.runner }} / ${{ matrix.state }} / ${{ matrix.trial }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'ubuntu-slim' && 15 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-slim, arch: x64, state: warm, trial: 1}
          - {runner: ubuntu-slim, arch: x64, state: cold, trial: 1}
          - {runner: ubuntu-26.04-arm, arch: arm64, state: warm, trial: 1}
          - {runner: ubuntu-26.04-arm, arch: arm64, state: cold, trial: 1}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Restore npm cache
        id: npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: arm-study-npm-${{ github.run_id }}-${{ matrix.arch }}
          fail-on-cache-miss: true
      - name: Restore ESLint cache
        id: eslint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .eslintcache
          key: arm-study-result-${{ github.run_id }}-${{ matrix.runner }}-${{ matrix.state }}-${{ matrix.trial }}
          restore-keys: ${{ matrix.state == 'warm' && format('arm-study-eslint-{0}-{1}-', github.run_id, matrix.arch) || '' }}
      - name: Verify cache condition
        env:
          STATE: ${{ matrix.state }}
          MATCHED: ${{ steps.eslint.outputs.cache-matched-key }}
          NPM_MATCHED: ${{ steps.npm.outputs.cache-matched-key }}
        run: |
          test -n "$NPM_MATCHED"
          if [ "$STATE" = warm ]; then
            test -n "$MATCHED"
            test -s .eslintcache
          else
            test -z "$MATCHED"
            test ! -e .eslintcache
          fi
          printf '%s\n' "$STATE $MATCHED" > "$RUNNER_TEMP/cache-condition.txt"
          node --version
          nproc
      - name: Lint JavaScript files
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/js-time.txt" env NODE="$(command -v node)" make lint-js ESLINT_CACHE_FLAGS="--cache --cache-strategy content --format json --output-file $RUNNER_TEMP/diagnostics.json"
      - name: Get release version numbers
        id: versions
        run: ./tools/lint-md/list-released-versions-from-changelogs.mjs >> "$GITHUB_OUTPUT"
      - name: Lint Markdown and verify man page
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/md-time.txt" env NODE="$(command -v node)" make lint-md ESLINT_CACHE_FLAGS="--cache --cache-strategy content --format json --output-file $RUNNER_TEMP/doc-diagnostics.json"
          test -f tools/doc/.manpagecheck/node.1
          sha256sum tools/doc/.manpagecheck/node.1 > "$RUNNER_TEMP/manpage.sha256"
        env:
          NODE_RELEASED_VERSIONS: ${{ steps.versions.outputs.NODE_RELEASED_VERSIONS }}
      - name: Save ESLint results
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .eslintcache
          key: ${{ steps.eslint.outputs.cache-primary-key }}
      - name: Normalize diagnostics
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          summaries = {}
          for name in ['diagnostics.json', 'doc-diagnostics.json']:
              path = root / name
              if not path.exists():
                  continue
              rows = json.loads(path.read_text())
              for row in rows:
                  row['filePath'] = os.path.relpath(row['filePath'])
              rows.sort(key=lambda row: row['filePath'])
              data = json.dumps(rows, sort_keys=True, separators=(',', ':')).encode()
              path.write_bytes(data)
              summaries[name] = {'sha256': hashlib.sha256(data).hexdigest(),
                  'files': len(rows), 'errors': sum(r['errorCount'] for r in rows),
                  'warnings': sum(r['warningCount'] for r in rows)}
          (root / 'summary.json').write_text(json.dumps(summaries))
          PYTHON
      - name: Upload diagnostics and measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: result-${{ matrix.runner }}-${{ matrix.state }}-${{ matrix.trial }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/*diagnostics.json
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/*-time.txt
            ${{ runner.temp }}/cache-condition.txt
            ${{ runner.temp }}/manpage.sha256
