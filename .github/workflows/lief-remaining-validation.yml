name: Remaining LIEF build and SEA validation
run-name: Remaining LIEF validation (${{ inputs.node_ref || '534c11738139' }})

on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: Node.js SHA or PR ref to resolve once for all nine builds
        type: string
        default: 534c117381397a1a598f9260f96b3d96be2e620c
        required: true
      upload_binaries:
        description: Upload the built Node.js and smoke SEA
        type: boolean
        default: false
  push:
    branches: [codex/lief-remaining-validation]
    paths:
      - .github/workflows/lief-remaining-validation.yml
      - tools/lief-validation/**

permissions:
  contents: read

concurrency:
  group: lief-remaining-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  RUST_VERSION: 1.88.0
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  LIEF_HELPER: ${{ github.workspace }}/harness/tools/lief-validation/run.py
  LIEF_INPUTS: ${{ github.workspace }}/lief-inputs
  LIEF_WORK: ${{ github.workspace }}/lief-work
  LIEF_RESULTS: ${{ github.workspace }}/results

jobs:
  prepare:
    if: github.repository == 'inoway46/node'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      node_sha: ${{ steps.prepare.outputs.node_sha }}
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout the selected Node revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nodejs/node
          ref: ${{ inputs.node_ref || '534c117381397a1a598f9260f96b3d96be2e620c' }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Install preparation tools
        run: python -m pip install --disable-pip-version-check cmake==4.4.3 ninja
      - name: Check validation harness
        run: python -B harness/tools/lief-validation/test_remaining.py
      - name: Prepare pinned versions and verify Git source archives
        id: prepare
        run: python "$LIEF_HELPER" prepare --source source --output "$LIEF_INPUTS" --no-use-updater
      - name: Preparation summary
        if: always()
        run: python "$LIEF_HELPER" summary --results "$LIEF_INPUTS/prepare-results" --label 'Versioned input preparation'
      - name: Upload exact versioned inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lief-remaining-validation-inputs
          path: |
            ${{ env.LIEF_INPUTS }}/node-*.tar.gz
            ${{ env.LIEF_INPUTS }}/LIEF-*.zip
            ${{ env.LIEF_INPUTS }}/inputs.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lief-remaining-preparation-evidence
          path: ${{ env.LIEF_INPUTS }}/prepare-results
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-bundled-0.17.0
            runner: ubuntu-24.04
            arch: x64
            variant: bundled-0.17.0
            jobs: 4
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
          - name: linux-x64-shared-0.17.0
            runner: ubuntu-24.04
            arch: x64
            variant: shared-0.17.0
            jobs: 4
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
          - name: linux-x64-shared-1.0.0
            runner: ubuntu-24.04
            arch: x64
            variant: shared-1.0.0
            jobs: 4
            cc: /usr/bin/gcc
            cxx: /usr/bin/g++
          - name: macos-arm64-bundled-0.17.0
            runner: macos-15
            arch: arm64
            variant: bundled-0.17.0
            jobs: 2
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - name: macos-arm64-shared-0.17.0
            runner: macos-15
            arch: arm64
            variant: shared-0.17.0
            jobs: 2
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - name: macos-x64-bundled-0.17.0
            runner: macos-15-intel
            arch: x64
            variant: bundled-0.17.0
            jobs: 3
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - name: macos-x64-shared-0.17.0
            runner: macos-15-intel
            arch: x64
            variant: shared-0.17.0
            jobs: 3
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - name: macos-x64-bundled-1.0.0
            runner: macos-15-intel
            arch: x64
            variant: bundled-1.0.0
            jobs: 3
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - name: macos-x64-shared-1.0.0
            runner: macos-15-intel
            arch: x64
            variant: shared-1.0.0
            jobs: 3
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config
      - name: Install CMake and Ninja
        run: python -m pip install --disable-pip-version-check cmake==4.4.3 ninja
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
      - name: Download the common versioned inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lief-remaining-validation-inputs
          path: ${{ env.LIEF_INPUTS }}
      - name: Verify archive contents and runner architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: python "$LIEF_HELPER" unpack --inputs "$LIEF_INPUTS" --work "$LIEF_WORK" --results "$LIEF_RESULTS" --variant "$VARIANT" --arch "$TARGET_ARCH"
      - name: Build external LIEF when selected
        env:
          BUILD_JOBS: ${{ matrix.jobs }}
        run: python "$LIEF_HELPER" external --work "$LIEF_WORK" --results "$LIEF_RESULTS" --jobs "$BUILD_JOBS"
      - name: Configure Node with selected LIEF
        run: python "$LIEF_HELPER" configure --work "$LIEF_WORK" --results "$LIEF_RESULTS"
      - name: Compile Node from fresh sources
        env:
          BUILD_JOBS: ${{ matrix.jobs }}
        run: python "$LIEF_HELPER" build --work "$LIEF_WORK" --results "$LIEF_RESULTS" --jobs "$BUILD_JOBS"
      - name: Generate and execute SEA, verify linkage, and run SEA tests
        timeout-minutes: 30
        run: python "$LIEF_HELPER" test --work "$LIEF_WORK" --results "$LIEF_RESULTS" --execute-sea
      - name: Summarize actual validation coverage
        if: always()
        env:
          JOB_LABEL: ${{ matrix.name }}
        run: python "$LIEF_HELPER" summary --results "$LIEF_RESULTS" --label "$JOB_LABEL"
      - name: Upload compiler, configuration, linkage and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-${{ matrix.name }}
          path: ${{ env.LIEF_RESULTS }}
          if-no-files-found: warn
          retention-days: 14
      - name: Upload built binaries when requested
        if: always() && inputs.upload_binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-${{ matrix.name }}
          path: |
            ${{ env.LIEF_WORK }}/node/out/Release/node
            ${{ env.LIEF_WORK }}/sea-smoke
            ${{ env.LIEF_WORK }}/lief-install/lib
          if-no-files-found: warn
          retention-days: 7

  summary:
    if: always() && github.repository == 'inoway46/node'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Workflow result
        env:
          NODE_SHA: ${{ needs.prepare.outputs.node_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            echo '## Remaining LIEF build and SEA validation'
            echo
            echo "Node revision: $NODE_SHA"
            echo "Input preparation: $PREPARE_RESULT"
            echo "Build matrix: $BUILD_RESULT"
            echo
            echo 'Nine remaining configurations use pinned inputs and fresh builds.'
            echo 'All jobs attempt SEA execution. macOS x64 failures are recorded without applying workarounds.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PREPARE_RESULT" = success && test "$BUILD_RESULT" = success
