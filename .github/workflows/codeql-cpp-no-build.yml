name: CodeQL C++ without build

on:
  push:
    branches: [codeql-cpp-no-build]

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'inoway46/node'
    name: Analyze C++ without build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nodejs/node
          ref: ae353ec38d57385e8b06cc14521ef75718cdd86c
          persist-credentials: false

      - name: Record environment and analysis scope
        run: |
          git rev-parse HEAD
          cat .github/codeql-config.yml
          uname -a
          cat /etc/os-release
          nproc
          free -m
          df -h .
          gcc --version
          python3 --version
          node --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: cpp
          build-mode: none
          config-file: ./.github/codeql-config.yml
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux64.tar.zst

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:cpp/build-mode:none
          output: codeql-results
          upload: never
          upload-database: false

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-cpp-no-build-results
          path: codeql-results
          if-no-files-found: warn
          retention-days: 7
