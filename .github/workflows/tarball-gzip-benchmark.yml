name: Tarball gzip benchmark

on:
  push:
    branches: [codex/benchmark-tarball-gzip]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  NODE_VERSION: lts/*

permissions:
  contents: read

jobs:
  build-tarball:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Make tarball
        run: |
          export DISTTYPE=nightly
          export DATESTRING=$(date "+%Y-%m-%d")
          export COMMIT=$(git rev-parse --short=10 "$GITHUB_SHA")
          ./configure && /usr/bin/time -f "MAKE_TAR_SECONDS=%e" make tar -j4 SKIP_XZ=1 GZIP_COMPRESSION=1
      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          path: '*.tar.gz'
          archive: false
  test-tarball-linux:
    needs: build-tarball
    runs-on: ubuntu-24.04-arm
    env:
      CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
      CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
      SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - name: Install Clang ${{ env.CLANG_VERSION }}
        uses: $/.github/actions/install-clang
        with:
          clang-version: ${{ env.CLANG_VERSION }}
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Set up sccache
        if: github.base_ref == 'main' || github.ref_name == 'main'
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.17.0
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: tarballs
      - name: Extract tarball
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"
      - name: Build
        run: make -C "$TAR_DIR" build-ci -j4 V=1
      - name: Test
        run: make -C "$TAR_DIR" test-ci -j1 V=1 TEST_CI_ARGS="-p dots --measure-flakiness 9"

  benchmark:
    needs: build-tarball
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    steps:
      - name: Download identical input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: tarballs
      - name: Benchmark gzip levels
        env:
          REPETITION: ${{ matrix.repetition }}
        run: |
          gzip --version
          uname -a
          gzip -dc tarballs/*.tar.gz > "$RUNNER_TEMP/input.tar"
          cd "$RUNNER_TEMP"
          sha256sum input.tar | tee input.sha256
          case "$REPETITION" in
            1) levels="1 6 9" ;;
            2) levels="6 9 1" ;;
            3) levels="9 1 6" ;;
          esac
          for level in $levels; do
            /usr/bin/time -f "LEVEL=$level SECONDS=%e USER=%U SYS=%S" \
              gzip -c -f -"$level" input.tar > "level-$level.tar.gz"
            stat --format="LEVEL=$level BYTES=%s" "level-$level.tar.gz"
            gzip -t "level-$level.tar.gz"
            gzip -dc "level-$level.tar.gz" | sha256sum
            mkdir "extract-$level"
            tar -xzf "level-$level.tar.gz" -C "extract-$level"
          done
          diff -qr extract-1 extract-6
          diff -qr extract-1 extract-9
